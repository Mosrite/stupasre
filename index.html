.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}

.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:7px 10px;color:#9ca3af;font-weight:500;text-align:right;border-bottom:2px solid #374151;white-space:nowrap}
th.left{text-align:left}
td{padding:6px 10px;border-bottom:1px solid #374151;text-align:right;font-variant-numeric:tabular-nums}
td.left{text-align:left;font-weight:600;color:#fff}

tr.total td{background:#374151;font-weight:700;border-top:2px solid #6b7280}

function derive(p) {
  const tot  = p.km + p.nk;
  const opex = p.hg + p.gs + p.ox;
  const mort = p.zi + p.ti;
  const gp   = tot - opex;
  const np   = gp - mort;
  const cf   = tot - opex - mort;
  const tr   = cf + p.ti;

  // Return metrics: passed through directly from Notion KPIs & Metrics (2025 Actual).
  // Source: https://www.notion.so/35496be88787810ab48eebb2f1844547
  // Do NOT recompute these — always source from Notion.
  const grossRentalYieldPct = p.grossRentalYield ?? null;
  const netRentalYieldPct   = p.netRentalYield   ?? null;
  const roePct              = p.roe              ?? null;

  return { ...p, tot, opex, mort, gp, np, cf, tr,
    grossRentalYieldPct, netRentalYieldPct, roePct,
    dscr:  gp/mort,
    ptr:   p.pp ? p.pp/(p.km*12) : null,
    ppSqm: (p.pp && p.size) ? Math.round(p.pp / p.size) : null,
    kmSqm: p.size ? +(p.km / p.size).toFixed(2) : null };
}

// ─── HELPERS ────────────────────────────────────────────────────────────────
const f  = (v,d=0) => v===null||v===undefined ? '—'
  : new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const fe = (v,d=0) => v===null ? '—' : '€\u202f'+f(v,d);
const fp = (v,d=1) => v===null ? '—' : f(v,d)+'\u202f%';
const fs = (v) => {  // short for axes
  const av = Math.abs(v);
  if (av >= 1000) return (v/1000).toFixed(1)+'k';
  return Math.round(v).toString();
};
const vc = (v) => v===null ? '#9ca3af' : v>=0 ? '#34d399' : '#f87171';
const bc = (v) => v>=0 ? '#34d399' : '#f87171';

// ─── SVG CHART ENGINE ───────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}, text) {
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
  if (text !== undefined) e.textContent = text;
  return e;
}

function makeChart({ data, W=480, H=210, ml=56, mr=14, mt=16, mb=36, unit='€', label='' }) {
  // data: [{name, bars:[{label,value,color}]}]
  const iW = W-ml-mr, iH = H-mt-mb;

  // Find value range
  const allVals = data.flatMap(d =>
    [ d.bars.filter(b=>b.value>0).reduce((s,b)=>s+b.value,0),
      d.bars.filter(b=>b.value<0).reduce((s,b)=>s+b.value,0) ]);
  const maxV = Math.max(0,...allVals);
  const minV = Math.min(0,...allVals);
  const range = maxV - minV || 1;

  const yPx = v => mt + (1-(v-minV)/range)*iH;
  const zeroY = yPx(0);
  const groupW = iW / data.length;
  const barW = Math.min(groupW*0.62, 56);

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', style:'overflow:visible;display:block'});

  // Grid lines + y-axis labels
  const ticks = 5;
  for (let i=0; i<=ticks; i++) {
    const v = minV + (range/ticks)*i;
    const y = yPx(v);
    svg.appendChild(el('line', {x1:ml,y1:y,x2:W-mr,y2:y,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text', {x:ml-5,y:y+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'}, fs(v)));
  }

  // Zero line
  svg.appendChild(el('line', {x1:ml,y1:zeroY,x2:W-mr,y2:zeroY,stroke:'#6b7280','stroke-width':'1.5'}));

  // Bars
  data.forEach((d, i) => {
    const cx = ml + groupW*(i+0.5);
    let posTop = zeroY, negBot = zeroY;

    d.bars.forEach(b => {
      if (b.value === 0) return;
      const h = Math.abs(b.value/range*iH);
      const y = b.value>=0 ? posTop-h : negBot;
      const rect = el('rect', {x:cx-barW/2, y, width:barW, height:h, fill:b.color, rx:'2'});
      const title = document.createElementNS(NS,'title');
      title.textContent = `${b.label||d.name}: ${unit}${f(b.value)}`;
      rect.appendChild(title);
      // Hover tooltip
      rect.addEventListener('mouseenter', function(e) {
        showTooltip(e, `<b>${d.name}</b><br/>${b.label}: ${unit}${f(b.value)}`);
      });
      rect.addEventListener('mousemove', moveTooltip);
      rect.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(rect);
      if (b.value>=0) posTop-=h; else negBot+=h;
    });

    // X label
    svg.appendChild(el('text', {x:cx, y:H-mb+14,'text-anchor':'middle',fill:'#9ca3af','font-size':'10'}, d.name));
  });

  // Y-axis label
  if (label) {
    const t = el('text', {x:8, y:mt+iH/2, 'text-anchor':'middle', fill:'#6b7280','font-size':'9',
      transform:`rotate(-90,8,${mt+iH/2})`}, label);
    svg.appendChild(t);
  }

  return svg;
}

// Grouped bar chart (multiple bars side by side per group)
function makeGroupedChart({ data, keys, colors, colorFns, W=480, H=210, ml=56, mr=14, mt=16, mb=36, unit='' }) {
  const iW = W-ml-mr, iH = H-mt-mb;
  const allVals = data.flatMap(d => keys.map(k => d[k]||0));
  const maxV = Math.max(0,...allVals);
  const minV = Math.min(0,...allVals);
  const range = maxV - minV || 1;
  const yPx = v => mt + (1-(v-minV)/range)*iH;
  const zeroY = yPx(0);
  const groupW = iW / data.length;
  const bw = Math.min(groupW*0.75/keys.length, 40);
  const gap = bw*0.25;

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', style:'overflow:visible;display:block'});

  // Grid + labels
  for (let i=0; i<=5; i++) {
    const v = minV + (range/5)*i;
    const y = yPx(v);
    svg.appendChild(el('line', {x1:ml,y1:y,x2:W-mr,y2:y,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text', {x:ml-5,y:y+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'}, fs(v)+(unit?unit:'')));
  }
  svg.appendChild(el('line', {x1:ml,y1:zeroY,x2:W-mr,y2:zeroY,stroke:'#6b7280','stroke-width':'1.5'}));

  // Reference line DSCR=1
  if (unit==='x') {
    const ry = yPx(1);
    svg.appendChild(el('line', {x1:ml,y1:ry,x2:W-mr,y2:ry,stroke:'#fbbf24','stroke-width':'1',
      'stroke-dasharray':'5,3'}));
    svg.appendChild(el('text', {x:W-mr+2,y:ry+3,fill:'#fbbf24','font-size':'8'}, '1.0'));
  }

  data.forEach((d, i) => {
    const cx = ml + groupW*(i+0.5) - (keys.length-1)*(bw+gap)/2;
    keys.forEach((k, ki) => {
      const v = d[k] !== undefined ? d[k] : 0;
      if (v===0) return;
      const h = Math.abs(v/range*iH);
      const y = v>=0 ? zeroY-h : zeroY;
      const x = cx + ki*(bw+gap) - bw/2;
      // colorFns[ki] allows per-value color (e.g. green/red by sign); falls back to colors[ki]
      const fill = (colorFns && colorFns[ki]) ? colorFns[ki](v) : (colors[ki]||'#60a5fa');
      const rect = el('rect', {x, y, width:bw, height:h, fill, rx:'2'});
      rect.addEventListener('mouseenter', e => showTooltip(e, `<b>${d.name}</b><br/>${k}: ${f(v,2)}${unit}`));
      rect.addEventListener('mousemove', moveTooltip);
      rect.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(rect);
    });
    svg.appendChild(el('text', {x:ml+groupW*(i+0.5),y:H-mb+14,'text-anchor':'middle',fill:'#9ca3af','font-size':'10'}, d.name));
  });
  return svg;
}

// Line chart for time-series data (market value development)
function makeLineChart({ series, W=900, H=260, ml=72, mr=130, mt=20, mb=36, unit='€' }) {
  const iW = W-ml-mr, iH = H-mt-mb;
  const allX = series.flatMap(s => s.points.map(p => p.x));
  const allY = series.flatMap(s => s.points.map(p => p.y));
  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const minY = 0, maxY = Math.max(...allY) * 1.05;
  const rangeX = maxX - minX || 1, rangeY = maxY - minY || 1;
  const xPx = x => ml + (x - minX) / rangeX * iW;
  const yPx = y => mt + (1 - (y - minY) / rangeY) * iH;

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', style:'overflow:visible;display:block'});

  // Grid + Y labels
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const v = minY + (maxY - minY) / ticks * i;
    const py = yPx(v);
    svg.appendChild(el('line', {x1:ml,y1:py,x2:W-mr,y2:py,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text', {x:ml-5,y:py+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'}, fs(v)));
  }

  // Vertical year lines + X labels
  for (let x = minX; x <= maxX; x++) {
    const px = xPx(x);
    svg.appendChild(el('line', {x1:px,y1:mt,x2:px,y2:H-mb,stroke:'#374151','stroke-dasharray':'2,4'}));
    svg.appendChild(el('text', {x:px,y:H-mb+12,'text-anchor':'middle',fill:'#9ca3af','font-size':'9'}, x));
  }

  // "Now" marker (April 2026)
  const NOW_X = 2026 + 3/12;
  const nowPx = xPx(NOW_X);
  svg.appendChild(el('line', {x1:nowPx,y1:mt,x2:nowPx,y2:H-mb,stroke:'#fbbf24','stroke-width':'1.5','stroke-dasharray':'5,3'}));
  svg.appendChild(el('text', {x:nowPx+3,y:mt+9,fill:'#fbbf24','font-size':'8'}, 'Apr 2026'));

  // Draw each series
  series.forEach(s => {
    const pts = s.points;
    for (let i = 0; i < pts.length - 1; i++) {
      const p1 = pts[i], p2 = pts[i+1];
      const attrs = {
        x1: xPx(p1.x), y1: yPx(p1.y), x2: xPx(p2.x), y2: yPx(p2.y),
        stroke: s.color, 'stroke-width': s.thick ? '2.5' : '1.5',
      };
      if (p2.projected) attrs['stroke-dasharray'] = '6,3';
      svg.appendChild(el('line', attrs));
    }
    // Dots
    pts.forEach(p => {
      const c = el('circle', {cx:xPx(p.x), cy:yPx(p.y), r: s.thick?'4':'3',
        fill:s.color, opacity:p.projected?'0.7':'1'});
      c.addEventListener('mouseenter', e => showTooltip(e,
        `<b>${s.name}</b><br/>${p.x}: ${unit}${f(p.y)}${p.projected?' <span style="color:#fbbf24">(projected)</span>':''}`));
      c.addEventListener('mousemove', moveTooltip);
      c.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(c);
    });
    // End label
    if (pts.length > 0) {
      const last = pts[pts.length-1];
      svg.appendChild(el('text', {x:xPx(last.x)+5, y:yPx(last.y)+3,
        fill:s.color, 'font-size': s.thick?'10':'9', 'font-weight': s.thick?'700':'400'}, s.name));
    }
  });

  return svg;
}

// Waterfall / bridge chart — each bar floats from running total of previous bars
function makeWaterfallChart({ steps, W=420, H=280, ml=64, mr=14, mt=20, mb=68 }) {
  const iW=W-ml-mr, iH=H-mt-mb;
  // Build bars with start/end positions
  let run=0;
  const bars=steps.map(s=>{
    const s0=s.isTotal?0:run;
    const s1=s.isTotal?s.value:run+s.value;
    if(!s.isTotal) run+=s.value;
    return{...s,s0,s1};
  });
  const allV=bars.flatMap(b=>[b.s0,b.s1]);
  const rawMax=Math.max(0,...allV), rawMin=Math.min(0,...allV);
  const pad=(rawMax-rawMin)*0.14;
  const maxV=rawMax+pad, minV=rawMin-pad;
  const range=maxV-minV||1;
  const yPx=v=>mt+(1-(v-minV)/range)*iH;
  const z=yPx(0);
  const gW=iW/bars.length, bW=Math.min(gW*0.62,44);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'overflow:visible;display:block'});
  // Grid
  for(let i=0;i<=5;i++){
    const v=minV+(range/5)*i, y=yPx(v);
    svg.appendChild(el('line',{x1:ml,y1:y,x2:W-mr,y2:y,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text',{x:ml-5,y:y+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'},fs(v)));
  }
  if(minV<0&&maxV>0) svg.appendChild(el('line',{x1:ml,y1:z,x2:W-mr,y2:z,stroke:'#6b7280','stroke-width':'1.5'}));
  bars.forEach((b,i)=>{
    const cx=ml+gW*(i+0.5), x=cx-bW/2;
    const top=yPx(Math.max(b.s0,b.s1)), bot=yPx(Math.min(b.s0,b.s1)), h=Math.max(2,bot-top);
    const fill=b.isTotal?(b.value>=0?'#34d399':'#f87171'):(b.color||(b.value>=0?'#34d399':'#dc2626'));
    // Connector line to next bar
    if(i<bars.length-1){
      const nCx=ml+gW*(i+1.5);
      svg.appendChild(el('line',{x1:cx+bW/2,y1:yPx(b.s1),x2:nCx-bW/2,y2:yPx(b.s1),
        stroke:'#4b5563','stroke-width':'1','stroke-dasharray':'3,2'}));
    }
    const rect=el('rect',{x,y:top,width:bW,height:h,fill,rx:'2',opacity:'0.9'});
    rect.addEventListener('mouseenter',e=>showTooltip(e,`<b>${b.label}</b><br/>€${f(b.value)}`));
    rect.addEventListener('mousemove',moveTooltip);
    rect.addEventListener('mouseleave',hideTooltip);
    svg.appendChild(rect);
    // Value label above/below bar
    const lv=b.value>=0?top-3:bot+10;
    svg.appendChild(el('text',{x:cx,y:lv,'text-anchor':'middle',fill:fill,
      'font-size':'9','font-weight':'600'},fs(b.value)));
    // Rotated x-axis label
    svg.appendChild(el('text',{x:cx,y:H-mb+12,'text-anchor':'end',fill:'#9ca3af','font-size':'9',
      transform:`rotate(-40,${cx},${H-mb+12})`},b.label));
  });
  return svg;
}

// Helper: decimal year fraction → "Mon YYYY"
function formatFrac(frac) {
  const yr = Math.floor(frac);
  const mo = Math.round((frac - yr) * 12) + 1;
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Math.min(mo-1,11)]+' '+yr;
}

// ── Model builders ───────────────────────────────────────────────────────────
// Recompute break-even year from pts array and KNK baseline
function recomputeBE(pts, knk) {
  let prevFrac = pts[0].y, prevCum = -knk;
  for (const p of pts) {
    const frac = p.y + 1;
    if (prevCum < 0 && p.cum >= 0) {
      const t = (-prevCum) / (p.cum - prevCum);
      return +(prevFrac + t * (frac - prevFrac)).toFixed(4);
    }
    prevFrac = frac; prevCum = p.cum;
  }
  return null;
}

// Build Chart1 and Chart2 models from an array of Notion rows (sorted by year)
function buildNotionModels(rows) {
  // KNK (net of private loans), equity, and fur totals from Notion
  const knk1    = rows.reduce((s,r) => s + Math.abs(r.knk||0), 0);
  const eqTotal = rows.reduce((s,r) => s + Math.abs(r.eq||0),  0);
  // Chart 1 (BE_MODEL): Op CF including initial renovation (fur); starting deficit = KNK
  let cum1 = 0;
  const pts1 = rows.map(r => {
    cum1 += r.km + r.nk + r.hg + r.gs + r.ox + (r.util||0) + r.zi + r.pzi + r.mc + r.pti + r.fur;
    return { y: r.year, cum: +(-knk1 + cum1).toFixed(2) };
  });
  // Chart 2 (BE_TOTAL_MODEL): Op CF excluding fur; starting deficit = KNK + equity + total fur.
  // All renovation capital is included in the starting deficit so the property line and the
  // 7% opportunity-cost line both start at the same point: −(KNK + equity + fur).
  const totalFur2 = rows.reduce((s,r) => s + Math.abs(r.fur||0), 0);
  const knk2 = knk1 + eqTotal + totalFur2;   // = purchaseYearOppK(id)
  let cum2 = 0;
  const pts2 = rows.map(r => {
    cum2 += r.km + r.nk + r.hg + r.gs + r.ox + (r.util||0) + r.zi + r.pzi + r.mc + r.pti;
    return { y: r.year, cum: +(-knk2 + cum2).toFixed(2) };
  });
  return {
    chart1: { knk: knk1, pts: pts1, be: recomputeBE(pts1, knk1) },
    chart2: { knk: knk2, pts: pts2, be: recomputeBE(pts2, knk2), totalCapital: knk2 },
  };
}

// Property Notion name → dashboard ID mapping
const _NPROP = { Berlin:'berlin', Eschweiler:'eschweiler', Huegelstr:'huegelstr', Ohmstr:'ohmstr', Leipzig:'leipzig' };

// Build per-property BE_MODEL, BE_TOTAL_MODEL and EQUITY_PAID from Notion data
const BE_MODEL = {}, BE_TOTAL_MODEL = {}, EQUITY_PAID = {}, _FUR_TOT = {};

Object.entries(_NPROP).forEach(([notionName, id]) => {
  const rows = NOTION_BE_DATA.filter(r => r.property === notionName).sort((a,b) => a.year - b.year);
  const m = buildNotionModels(rows);
  BE_MODEL[id]       = m.chart1;
  BE_TOTAL_MODEL[id] = m.chart2;

// Private loans and overfinancing handled natively in Notion data (knk is already net)
const PRIV_LOANS    = {};
const OVERFINANCING = {};

// Capital base for 7% opportunity-cost line: net KNK + equity + all initial renovation
function purchaseYearOppK(id) {
  if (id === '_portfolio')
    return Object.values(_NPROP).reduce((s,i) => s + purchaseYearOppK(i), 0);
  return BE_MODEL[id].knk + (EQUITY_PAID[id]||0) + (_FUR_TOT[id]||0);
}

// Cumulative initial renovation (fur) costs realised through fractional year frac.
// Subtracted from grossReturn to compute pureOpCF (Op CF without one-time renovation capex).
function cumRepairsAtFrac(id, frac) {
  const rows = id === '_portfolio'
    ? NOTION_BE_DATA
    : NOTION_BE_DATA.filter(r => r.property === _NPROP[id] || Object.values(_NPROP)[0] === id);
  // For portfolio sum all; for individual filter by property
  const filtered = id === '_portfolio'
    ? NOTION_BE_DATA
    : NOTION_BE_DATA.filter(r => r.property === Object.keys(_NPROP).find(k => _NPROP[k]===id));
  return filtered.reduce((sum, r) => {
    const amt = Math.abs(r.fur||0);
    if (!amt) return sum;
    if (r.year + 1 <= frac) return sum + amt;          // year fully elapsed
    if (r.year < frac)      return sum + amt * (frac - r.year); // partial year
    return sum;
  }, 0);
}

// Decimal-year fraction → linearly interpolated cumulative (between year-end points).
// Each pts[k] represents end-of-year-y_k. We treat (y_k+1, cum_k) as an anchor in time.
function beCumAtFrac(model, frac) {
  const pts = model.pts;
  if (!pts.length) return null;
  // Anchor: at start-of-first-year (frac = pts[0].y), cumulative = -KNK (before any Op CF).
  // At end-of-year y_k (frac = y_k + 1), cumulative = pts[k].cum.
  const startFrac = pts[0].y;
  if (frac <= startFrac) return -model.knk;
  // Build piecewise list of (frac, cum)
  let prevFrac = startFrac, prevCum = -model.knk;
  for (const p of pts) {
    const endFrac = p.y + 1;
    if (frac <= endFrac) {
      const t = (frac - prevFrac) / (endFrac - prevFrac);
      return prevCum + t * (p.cum - prevCum);
    }
    prevFrac = endFrac;
    prevCum = p.cum;
  }
  return prevCum; // beyond last point
}

// Cash-flow-aware break-even timeline chart.
// Each line is the per-property cumulative position (Op CF excl. Tilgung minus KNK)
// over time. Solid through end-2025 (historical), dashed from 2026 (projected).
// items: [{id, name, color, model:{knk, be, pts}}]
// capitalLabel: label used in tooltips for the starting-capital figure ('KNK' or 'Capital Employed')
function makeBreakEvenChart({ items, W=900, H=380, ml=72, mr=148, mt=24, mb=38, xMin=null, xMax=null, showOppCost=false, capitalLabel='KNK' }) {
  const iW=W-ml-mr, iH=H-mt-mb;
  const nowFrac = 2026 + 3/12;
  // Use end-of-2026 as the solid/dashed boundary: 2026 is the current year and its
  // full-year projected value is used, so there are no gaps up to "now".
  const histEndFrac = 2027;

  // X range (caller may override for cross-chart alignment)
  const minX = xMin !== null ? xMin : Math.floor(Math.min(...items.map(it => it.model.pts[0].y)));
  const validBE = items.filter(it => it.model.be != null && it.model.be < 2060).map(it => it.model.be);
  const maxBE = validBE.length ? Math.max(...validBE) : nowFrac;
  const maxX = xMax !== null ? xMax : Math.ceil(Math.max(maxBE, nowFrac) + 1.5);

  // Y range (per-property only — exclude portfolio, which we do not plot in main chart)
  const allCums = items.flatMap(it => it.model.pts.filter(p => p.y <= maxX).map(p => p.cum));
  const minKNK = Math.min(...items.map(it => it.model.knk));
  const maxKNK = Math.max(...items.map(it => it.model.knk));
  const minCum = Math.min(-maxKNK, ...allCums);
  // Cap Y range at the value reached at maxX to keep the chart readable
  const yCap = items.reduce((m,it) => {
    const v = beCumAtFrac(it.model, maxX);
    return Math.max(m, v);
  }, 0);
  // Opp-cost lines now start at −K (same as property lines start at −knk).
  // minY must accommodate the lowest opp-line start; maxY accommodates the end value (−2 formula).
  const maxOppK   = showOppCost ? items.reduce((m,it) => Math.max(m, purchaseYearOppK(it.id)), 0) : 0;
  const oppEndMax = showOppCost
    ? items.reduce((m,it) => Math.max(m, purchaseYearOppK(it.id) * (Math.pow(1.07, maxX - it.model.pts[0].y) - 2)), 0)
    : 0;
  const minY = Math.min(minCum * 1.08, showOppCost ? -maxOppK * 1.05 : 0);
  const maxY = Math.max(yCap * 1.1, oppEndMax * 1.05, maxKNK * 0.2, 5000);
  const rangeY = maxY - minY;

  const xPx = x => ml + (x - minX) / (maxX - minX) * iW;
  const yPx = y => mt + (1 - (y - minY) / rangeY) * iH;
  const zeroY = yPx(0);
  const histPx = xPx(histEndFrac);

  const svg = el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'overflow:visible;display:block'});

  // Y grid
  const yStep = Math.ceil(maxKNK / 4 / 5000) * 5000 || 5000;
  for(let v = Math.ceil(minY/yStep)*yStep; v <= maxY + yStep/2; v += yStep){
    const py = yPx(v);
    if(py < mt-2 || py > H-mb+2) continue;
    svg.appendChild(el('line',{x1:ml,y1:py,x2:W-mr,y2:py,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text',{x:ml-5,y:py+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'},fs(v)));
  }

  // Break-even (y=0) line
  svg.appendChild(el('line',{x1:ml,y1:zeroY,x2:W-mr,y2:zeroY,stroke:'#34d399','stroke-width':'1.5'}));
  svg.appendChild(el('text',{x:ml-5,y:zeroY-4,'text-anchor':'end',fill:'#34d399','font-size':'8','font-weight':'600'},'Break-even'));

  // X year ticks
  const span = maxX - minX;
  for(let yr=minX; yr<=maxX; yr++){
    const px = xPx(yr);
    svg.appendChild(el('line',{x1:px,y1:mt,x2:px,y2:H-mb,stroke:'#374151','stroke-dasharray':'2,4'}));
    if(span <= 12 || yr % 2 === 0){
      svg.appendChild(el('text',{x:px,y:H-mb+13,'text-anchor':'middle',fill:'#9ca3af','font-size':'9'},yr));
    }
  }

  // Solid/dashed boundary marker (end of 2026 — current year included via projected data)
  if (histPx >= ml && histPx <= W-mr) {
    svg.appendChild(el('line',{x1:histPx,y1:mt,x2:histPx,y2:H-mb,stroke:'#6b7280','stroke-width':'1','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text',{x:histPx-3,y:mt+9,'text-anchor':'end',fill:'#9ca3af','font-size':'8'},'← 2026'));
    svg.appendChild(el('text',{x:histPx+3,y:mt+9,fill:'#9ca3af','font-size':'8'},'Forecast →'));
  }

  // "Now" vertical marker (Apr 2026)
  const nowPx = xPx(nowFrac);
  svg.appendChild(el('line',{x1:nowPx,y1:mt,x2:nowPx,y2:H-mb,stroke:'#fbbf24','stroke-width':'1.5','stroke-dasharray':'5,3'}));
  svg.appendChild(el('text',{x:nowPx+3,y:mt+19,fill:'#fbbf24','font-size':'8'},'Apr 2026'));

  // Per-property piecewise-linear curves
  items.forEach((it, idx) => {
    const { color, name, model } = it;

    // ── Property group (all paths + dots for this property) ────────────────
    // Click the legend entry to toggle visibility.
    const propGroup = el('g');
    svg.appendChild(propGroup);

    // Build polyline points: start at (firstPt.y, -knk), then each (y+1, cum)
    const polyPts = [{ frac: model.pts[0].y, cum: -model.knk }];
    model.pts.forEach(p => {
      if (p.y + 1 <= maxX + 0.01) polyPts.push({ frac: p.y + 1, cum: p.cum });
    });

    // Split into solid (≤ histEndFrac) and dashed (> histEndFrac)
    const solidPts = [], dashedPts = [];
    polyPts.forEach(p => (p.frac <= histEndFrac + 1e-6 ? solidPts : dashedPts).push(p));

    // Connect solid → dashed with no gap
    if (solidPts.length && dashedPts.length) {
      const last = solidPts[solidPts.length - 1];
      const next = dashedPts[0];
      if (next.frac > histEndFrac) {
        if (last.frac < histEndFrac) {
          const t = (histEndFrac - last.frac) / (next.frac - last.frac);
          const bp = { frac: histEndFrac, cum: last.cum + t * (next.cum - last.cum) };
          solidPts.push(bp); dashedPts.unshift(bp);
        } else {
          dashedPts.unshift(last);
        }
      }
    }

    const toPath = pts => pts.map((p,i) => (i===0?'M':'L')+xPx(p.frac).toFixed(2)+','+yPx(p.cum).toFixed(2)).join(' ');
    if (solidPts.length >= 2)
      propGroup.appendChild(el('path',{d:toPath(solidPts), stroke:color, 'stroke-width':'2.5', fill:'none'}));
    if (dashedPts.length >= 2)
      propGroup.appendChild(el('path',{d:toPath(dashedPts), stroke:color, 'stroke-width':'1.8', 'stroke-dasharray':'6,3', fill:'none'}));

    // Break-even crossing dot
    if (model.be != null && model.be <= maxX + 0.5) {
      const beX = xPx(model.be);
      const beDot = el('circle',{cx:beX,cy:zeroY,r:'5',fill:color,stroke:'#111827','stroke-width':'1.5'});
      const beLabel = model.be <= histEndFrac ? `Broke even: <b>${formatFrac(model.be)}</b> ✓` : `Break-even: <b>${formatFrac(model.be)}</b>`;
      beDot.addEventListener('mouseenter',e=>showTooltip(e,
        `<b>${name}</b><br/>${beLabel}<br/>${capitalLabel}: ${fe(Math.round(model.knk))}`));
      beDot.addEventListener('mousemove',moveTooltip);
      beDot.addEventListener('mouseleave',hideTooltip);
      propGroup.appendChild(beDot);
    }

    // Now-position dot (Apr 2026)
    const nowCum = beCumAtFrac(model, nowFrac);
    const nowDot = el('circle',{cx:nowPx,cy:yPx(nowCum),r:'3.5',fill:color,stroke:'#111827','stroke-width':'1.2'});
    const pct = Math.max(0, Math.min(100, 100 * (1 + nowCum / model.knk)));
    nowDot.addEventListener('mouseenter',e=>showTooltip(e,
      `<b>${name}</b><br/>Apr 2026: ${nowCum>=0?'+':''}${fe(Math.round(nowCum))} vs. break-even<br/>${capitalLabel}: ${fe(Math.round(model.knk))}<br/>Progress: ${pct.toFixed(0)}%`));
    nowDot.addEventListener('mousemove',moveTooltip);
    nowDot.addEventListener('mouseleave',hideTooltip);
    propGroup.appendChild(nowDot);

    // Start dot at purchase
    propGroup.appendChild(el('circle',{cx:xPx(model.pts[0].y),cy:yPx(-model.knk),r:'3',fill:color,stroke:'#111827','stroke-width':'1',opacity:'0.7'}));

    // Opportunity-cost line (Chart 2 only)
    if (showOppCost) {
      const K = purchaseYearOppK(it.id);
      const t0 = model.pts[0].y;
      const oppPts = [];
      for (let yr = t0; yr <= maxX; yr += 0.5)
        oppPts.push({ frac: yr, opp: K * (Math.pow(1.07, yr - t0) - 2) });
      const oppPath = oppPts.map((p,i) => (i===0?'M':'L')+xPx(p.frac).toFixed(2)+','+yPx(p.opp).toFixed(2)).join(' ');
      const oppLine = el('path',{d:oppPath,stroke:color,'stroke-width':'0.8','stroke-dasharray':'3,4',fill:'none',opacity:'0.45'});
      const oppNow = K * (Math.pow(1.07, nowFrac - t0) - 2);
      oppLine.addEventListener('mouseenter',e=>showTooltip(e,
        `<b>${name} — 7% stock market alternative</b><br/>` +
        `Capital: ${fe(Math.round(K))}<br/>` +
        `At Apr 2026: ${oppNow >= 0 ? '+' : ''}${fe(Math.round(oppNow))} vs. capital`));
      oppLine.addEventListener('mousemove',moveTooltip);
      oppLine.addEventListener('mouseleave',hideTooltip);
      propGroup.appendChild(oppLine);
    }

    // ── Legend entry (clickable — toggles this property's visibility) ──────
    const legY = mt + 20 + idx * 26;
    const legGroup = el('g');
    legGroup.style.cursor = 'pointer';
    legGroup.title = 'Click to show/hide';
    let hidden = false;
    const legRect = el('rect',{x:W-mr+10,y:legY-9,width:14,height:10,fill:color,rx:'2'});
    const ln1 = el('text',{x:W-mr+28,y:legY,fill:'#d1d5db','font-size':'10'});
    ln1.textContent = name;
    const ln2 = el('text',{x:W-mr+28,y:legY+11,fill:'#6b7280','font-size':'9'});
    ln2.textContent = (model.be!=null&&model.be<=histEndFrac) ? 'Done ✓ '+formatFrac(model.be)
      : (model.be!=null&&model.be<=maxX+0.5) ? formatFrac(model.be) : '>'+maxX;
    legGroup.appendChild(legRect);
    legGroup.appendChild(ln1);
    legGroup.appendChild(ln2);
    legGroup.addEventListener('click', () => {
      hidden = !hidden;
      propGroup.style.display = hidden ? 'none' : '';
      legGroup.setAttribute('opacity', hidden ? '0.3' : '1');
    });
    svg.appendChild(legGroup);
  });

  return svg;
}

const TT = document.getElementById('tooltip');
function showTooltip(e, html) { TT.innerHTML=html; TT.style.display='block'; moveTooltip(e); }
function moveTooltip(e) {
  const r = document.body.getBoundingClientRect();
  TT.style.left = (e.clientX - r.left + 12)+'px';
  TT.style.top  = (e.clientY - r.top  - 8)+'px';
}
function hideTooltip() { TT.style.display='none'; }
function showKNKDetailTooltip(e, id) {
  const items = KNK_DETAIL[id] || [];
  const rows = items.map(t => `${t.category} (${t.party}), ${t.date}: <b>${fe(t.amount,2)}</b>`).join('<br/>');
  const total = items.reduce((s,t)=>s+t.amount,0);
  showTooltip(e, `<b>KNK — ${id.charAt(0).toUpperCase()+id.slice(1)} Breakdown</b><br/>${rows}<br/><hr style="border-color:#374151;margin:4px 0"/><b>Total: ${fe(total,2)}</b>`);
}
function showRepairDetailTooltip(e, id, year) {
  const all = REPAIRS_DETAIL[id] || [];
  const items = year ? all.filter(t => parseInt(t.date.slice(-4)) === year) : all;
  if (!items.length) return;
  const rows = items.map(t => `${t.desc} (${t.party}), ${t.date}: <b>${fe(t.amount,2)}</b>`).join('<br/>');
  const total = items.reduce((s,t)=>s+t.amount,0);
  const name = id.charAt(0).toUpperCase()+id.slice(1);
  const hdr = year ? `${name} ${year}` : name;
  showTooltip(e, `<b>Repair &amp; Maintenance — ${hdr} (invoices on file)</b><br/>${rows}<br/><hr style="border-color:#374151;margin:4px 0"/><b>Total invoiced: ${fe(total,2)}</b><br/><span style="color:#6b7280;font-size:10px">CSV accounting total may differ</span>`);
}
function showBERepairTooltip(e, id, ovf) {
  const all = REPAIRS_DETAIL[id] || [];
  const rows = all.map(t => `${t.desc} (${t.party}), ${t.date}: <b>${fe(t.amount,2)}</b>`).join('<br/>');
  const gross = all.reduce((s,t)=>s+t.amount,0);
  const name = id === '_portfolio' ? 'Portfolio' : id.charAt(0).toUpperCase()+id.slice(1);
  let html = `<b>Repair &amp; Maintenance — ${name}</b>`;
  if (rows) html += `<br/>${rows}<br/><hr style="border-color:#374151;margin:4px 0"/>Gross invoiced: ${fe(gross,2)}`;
  if (ovf > 0) {
    html += `<br/><span style="color:#34d399">− ${fe(ovf)} overfinancing credit (loan &gt; purchase price)</span>`;
    html += `<br/><b>Net effective: ${fe(gross - ovf, 2)}</b>`;
  } else {
    if (rows) html += `<br/><b>Total: ${fe(gross,2)}</b>`;
    else html += `<br/><span style="color:#6b7280">No repairs on record</span>`;
  }
  html += `<br/><span style="color:#6b7280;font-size:10px">CSV accounting total may differ</span>`;
  showTooltip(e, html);
}

    });
    portRepByY[y] = hasAny ? ytot : null;

  let repH = '<div class="chart-title" style="margin-bottom:4px">Repair &amp; Maintenance Costs (€/year)</div>'

    +repYears.map(y=>`<th>${y}</th>`).join('')

  let portRepTotal = 0;
  D.forEach(d => {
    const byY = {}; (REPAIRS[d.id]||[]).forEach(r=>{ byY[r.y]=r.amt; });
    const known = (REPAIRS[d.id]||[]).filter(r=>r.amt!==null).map(r=>r.amt);
    const tot = known.length ? known.reduce((s,v)=>s+v,0) : null;
    const yrsWithData = known.length;
    const avg = yrsWithData ? tot/yrsWithData : null;
    if (tot!==null) portRepTotal += tot;
    const rooms = TURNOVER[d.id].slots;
    const epr = (avg!==null && rooms) ? avg/rooms : null;
    const epm = (avg!==null && d.size) ? avg/d.size : null;
    repH += `<tr><td class="left">${d.name}</td>`
      +repYears.map(y => {
          const hasDetail = (REPAIRS_DETAIL[d.id]||[]).some(t => parseInt(t.date.slice(-4)) === y);
          const hover = `onmouseenter="showRepairDetailTooltip(event,'${d.id}',${y})" onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()"`;
          if (byY[y]===undefined) return '<td style="color:#374151;font-size:9px">n/a</td>';
          if (byY[y]===null)      return '<td style="color:#6b7280">—</td>';
          if (byY[y]===0)         return hasDetail
            ? `<td style="color:#4b5563;cursor:help" ${hover}>€ 0</td>`
            : '<td style="color:#4b5563">€ 0</td>';
          return hasDetail
            ? `<td style="color:#f9fafb;cursor:help" ${hover}>${fe(byY[y],0)}</td>`
            : `<td style="color:#f9fafb">${fe(byY[y],0)}</td>`;

      +`<td style="color:#60a5fa">${epr!==null?fe(epr,0):'—'}</td>`
      +`<td style="color:#34d399">${epm!==null?fe(epm,1):'—'}</td>`
      +'</tr>';
  });
  // Portfolio totals row
  const portTotRepKnown = repYears.map(y=>portRepByY[y]).filter(v=>v!==null);

      : '<td style="color:#6b7280">—</td>').join('')
    +`<td>${portRepTotal?fe(portRepTotal,0):'—'}</td>`
    +`<td>${portAvgRep!==null?fe(portAvgRep,0):'—'}</td>`
    +`<td>${portRooms}</td>`
    +`<td style="color:#60a5fa">${portAvgRep?fe(portAvgRep/portRooms,0):'—'}</td>`
    +`<td style="color:#34d399">${portAvgRep?fe(portAvgRep/portSize,1):'—'}</td>`
    +'</tr></tbody></table>';
  repCard.innerHTML = repH;
  atRow.appendChild(repCard);

  // Tenant turnover
  const tvCard = document.createElement('div');
  tvCard.className='card'; tvCard.style.overflowX='auto';
  const NOW_YR = 2026 + 3/12; // April 2026
  let tvH = '<div class="chart-title" style="margin-bottom:4px">Tenant Turnover</div>'

    +'<th class="left">Move-outs</th><th>Rate/yr</th></tr></thead><tbody>';

  D.forEach(d => {
    const tv = TURNOVER[d.id];

    tvH += `<tr><td class="left">${d.name}</td><td>${tv.since}</td><td>${tv.slots}</td>`

      +`<td style="color:${outs>0?'#fbbf24':'#6b7280'}">${rate}</td></tr>`;
  });
  tvH += `<tr class="total"><td class="left">PORTFOLIO</td><td>—</td><td>${portSlots}</td>`
    +`<td class="left">${portOuts} known</td><td>—</td></tr></tbody></table>`;
  tvCard.innerHTML = tvH;
  atRow.appendChild(tvCard);
  sec.appendChild(atRow);

  // Footnotes
  const fn = document.createElement('div');
  fn.className='footnotes';
  fn.innerHTML = `
    <b>Gross Rental Yield</b> = (Kaltmiete × 12) / Kaufpreis. Sourced from Notion KPIs &amp; Metrics (2025 Actual). Financing and operating costs excluded.<br>
    <b>Net Rental Yield</b> = ((Warmmiete − Hausgeld − Grundsteuer − Ø monthly repair) × 12) / (Kaufpreis + KNK). Sourced from Notion KPIs &amp; Metrics (2025 Actual).<br>
    <b>Return on Equity</b> = (NOI after mortgage interest) / (Equity invested + KNK). Equity = Kaufpreis − original loan. Eschweiler special treatment: DSL Privatkredit is a consumer loan — both Zinsen &amp; Tilgung reduce the numerator; KNK is netted against DSL loan in the denominator. Sourced from Notion KPIs &amp; Metrics (2025 Actual).<br>
    Maintenance reserves used (€/m²/yr): Berlin €5.0, Eschweiler €5.5, Hügelstr. €5.5, Ohmstr. €4.5, Leipzig €5.0.<br>
    <b>Cashflow</b> = Total income (Kaltmiete + NK) − Opex − Mortgage. NK treated as income offsetting operating costs.<br>
    <b>Total Return</b> = Cashflow + Tilgung. Tilgung reduces debt and builds equity — it's not an economic loss.<br>
    <b>DSCR</b> = Pre-Financing CF (NOI) / Total Mortgage. &gt; 1.0 means operating income covers debt service.<br>
    <b>Break-Even charts</b> moved to the Break-Even tab. Source: <code>/financial_model/model_output/forward_cashflow.json</code>.<br>
    Grundsteuer &amp; DKB fees are quarterly amounts ÷ 3. Tax effects (AfA, Werbungskosten) not reflected here.`;
  sec.appendChild(fn);
}

function renderDetail() {
  const sec = document.getElementById('detail');

  // Property selector buttons
  const btns = document.createElement('div');
  btns.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px';
  btns.id='prop-btns';
  D.forEach((d,i) => {
    const b = document.createElement('button');
    b.className='prop-btn'+(i===0?' active':'');
    b.textContent = d.name;
    b.onclick = () => {
      document.querySelectorAll('.prop-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderPropDetail(d.id);
    };
    btns.appendChild(b);
  });
  sec.appendChild(btns);

  const container = document.createElement('div');
  container.id='prop-detail';
  sec.appendChild(container);

  renderPropDetail(D[0].id);
}

// ─── BREAK-EVEN HELPERS ──────────────────────────────────────────────────────
// Find the fractional year when the property's cumulative CF+Tilgung
// first exceeds what oppK invested in stocks at 7% p.a. would have returned.
// tiltModel = BE_TILT_MODEL[id], oppK = capital to compare against, t0 = purchase year
function findBeatsOppDate(tiltModel, oppK, t0) {
  if (!tiltModel || !tiltModel.pts.length || !oppK) return null;
  let prevFrac = tiltModel.pts[0].y;
  let prevCum  = -tiltModel.knk;
  let prevF    = prevCum; // opp = 0 at t0, so f = cum - opp = cum

  for (const p of tiltModel.pts) {
    const endFrac = p.y + 1;
    const oppEnd  = oppK * (Math.pow(1.07, endFrac - t0) - 1);
    const fEnd    = p.cum - oppEnd;

    if (prevF < 0 && fEnd >= 0) {
      // Binary search within this 1-year segment for the crossing
      const STEPS = 48;
      let pf = prevF, pFr = prevFrac;
      for (let i = 1; i <= STEPS; i++) {
        const fr  = prevFrac + i / STEPS * (endFrac - prevFrac);
        const tl  = (fr - prevFrac) / (endFrac - prevFrac);
        const cum = prevCum + tl * (p.cum - prevCum);   // linear interp
        const opp = oppK * (Math.pow(1.07, fr - t0) - 1); // exponential
        const f   = cum - opp;
        if (f >= 0) {
          // linear interp between (pFr, pf) and (fr, f)
          return pFr + (-pf) / (f - pf) * (fr - pFr);
        }
        pf = f; pFr = fr;
      }
      return endFrac;
    }
    prevFrac = endFrac;
    prevCum  = p.cum;
    prevF    = fEnd;
  }
  return null; // never beats 7% within data range
}

function renderBreakEven() {
  const sec = document.getElementById('break-even');
  sec.innerHTML = ''; // clear for re-render
  const NOW_FRAC = 2026 + 3/12;
  const PROP_COLORS = {
    berlin:'#60a5fa', eschweiler:'#2dd4bf', huegelstr:'#f59e0b', ohmstr:'#f87171', leipzig:'#a78bfa'
  };

  function cumRepairsFor(id) {
    if (id === '_portfolio') {
      return Object.keys(REPAIRS).reduce((s,k) => s + (REPAIRS[k]||[]).reduce((s2,r) => s2+(r.amt||0), 0), 0);
    }
    return (REPAIRS[id]||[]).reduce((s,r) => s+(r.amt||0), 0);
  }

  function makeBeItems(model) {
    return D.map(d => ({ id:d.id, name:d.name, color:PROP_COLORS[d.id], model:model[d.id] }));
  }

  // Purchase date → fractional year for each property (for duration calculation)
  function purchFrac(id) {
    const pd = MORTGAGE_DATA[id] && MORTGAGE_DATA[id].purchaseDate;
    if (!pd) return null;
    const [y, m] = pd.split('-').map(Number);
    return y + (m - 1) / 12;
  }
  // Format duration between two fractional years as "X y + Y m"
  function fracDur(f1, f2) {
    if (f1 == null || f2 == null || f2 <= f1) return null;
    const totalM = Math.round((f2 - f1) * 12);
    const y = Math.floor(totalM / 12);
    const m = totalM % 12;
    return m > 0 ? `${y} y + ${m} m` : `${y} y`;
  }

  // Compute cumulative Tilgung paid on a private loan up to fractional year `frac`.
  // Used to undo the PRIV_LOANS adjustment for the progress bar (so bars don't change
  // just because Tilgung reduces Op CF while KNK is netted to near-zero).
  function privCumTilgung(privL, frac) {
    if (!privL) return 0;
    const r = privL.annualRate / 12;
    const P = privL.amount * r / (1 - Math.pow(1 + r, -privL.months));
    const mPaid = Math.min(privL.months, Math.max(0, Math.floor((frac - privL.startY) * 12)));
    let bal = privL.amount, ct = 0;
    for (let m = 0; m < mPaid; m++) { const ti = P - bal * r; ct += ti; bal -= ti; }
    return ct;
  }

  // progressVsKNK=true → progress bar denominator is KNK (Chart 1)
  // progressVsKNK=false → progress bar denominator is totalCapital (Chart 2)
  function makeBeTable(beItems, model, progressVsKNK) {
    const wrap = document.createElement('div');
    wrap.style.overflowX = 'auto';
    let html = '<table style="margin-top:8px"><thead><tr>'
      +'<th class="left">Property</th>'
      +'<th>Break-Even</th>'
      +'<th>Beats 7% p.a.<br><span style="font-weight:400;color:#6b7280;font-size:9px">vs. stocks</span></th>'
      +'<th>KNK</th>'
      +'<th>Repair &amp; Maint.</th>'
      +'<th>Equity Paid In</th>'
      +'<th>Total Capital</th>'
      +'<th>Cumul. Op CF<br><span style="font-weight:400;color:#6b7280">Apr 2026</span></th>'
      +'<th>Progress</th>'
      +'</tr></thead><tbody>';

    beItems.forEach(d => {
      const m = model[d.id];
      const eq = EQUITY_PAID[d.id] || 0;
      const knk = BE_MODEL[d.id].knk;
      // Use BE_TOTAL_MODEL for all capital figures — already overfinancing-adjusted
      const tc = BE_TOTAL_MODEL[d.id].totalCapital;
      const netRepairs = tc - knk - eq;
      const ovf = OVERFINANCING[d.id] || 0;
      const privL = PRIV_LOANS[d.id];
      const privBadge = privL
        ? `<br><span style="font-size:9px;color:#a78bfa" title="Privatkredit (€${(privL.amount/1000).toFixed(0)}k) financed KNK — netted against own capital">(−€${(privL.amount/1000).toFixed(0)}k Privatkred.)</span>`
        : '';
      // grossReturn: cumulative position from BE_MODEL (includes repair costs, used for progress bar)
      const grossReturn = beCumAtFrac(BE_MODEL[d.id], NOW_FRAC) + knk;
      // pureOpCF: cumulative Op CF excl. repairs (rent − opex − Zinsen only, no capex)
      const pureOpCF = grossReturn + cumRepairsAtFrac(d.id, NOW_FRAC);
      // For progress bar: undo PRIV_LOANS adjustment so bars reflect pre-netting economic reality.
      // PRIV_LOANS nets privL.amount off KNK and subtracts cumTilgung from Op CF.
      // To restore: add back cumTilgung to numerator, add back privL.amount to denominator.
      const privTi = privCumTilgung(privL, NOW_FRAC);
      const progressGrossReturn = grossReturn + privTi;
      const progressKNK = knk + (privL ? privL.amount : 0);
      const progressBase = progressVsKNK ? progressKNK : tc;
      const pct = progressBase > 0 ? Math.max(0, Math.min(100, 100 * progressGrossReturn / progressBase)) : 0;
      const barPct = pct.toFixed(0);
      const progBar = `<div style="background:#374151;border-radius:4px;height:8px;width:100%;min-width:80px">`
        +`<div style="background:${pct>=100?'#34d399':'#60a5fa'};width:${barPct}%;height:8px;border-radius:4px"></div>`
        +`</div><span style="font-size:9px;color:#9ca3af">${barPct}%</span>`;
      // Break-even date + duration from purchase
      const pf = purchFrac(d.id);
      const beDateStr = m.be != null ? formatFrac(m.be) : null;
      const beDurStr  = m.be != null ? fracDur(pf, m.be) : null;
      const beStr = m.be != null
        ? `<span style="color:${m.be<=NOW_FRAC?'#34d399':'#9ca3af'}">${beDateStr}${m.be<=NOW_FRAC?' ✓':''}</span>`
          + (beDurStr ? `<br><span style="color:#4b5563;font-size:9px">${beDurStr}</span>` : '')
        : `<span style="color:#9ca3af">&gt;2060</span>`;
      const ovfBadge = ovf > 0
        ? ` <span style="font-size:9px;color:#34d399">(−€${(ovf/1000).toFixed(0)}k OVF)</span>`
        : '';
      // "Beats 7%" = when cumulative Op CF exceeds what oppK at 7% p.a. would have returned
      // oppK = net KNK + equity + purchase-year repairs (consistent with the chart opp-cost line)
      const oppK = purchaseYearOppK(d.id);
      const t0 = BE_MODEL[d.id].pts[0].y;
      const beatsDate = findBeatsOppDate(BE_MODEL[d.id], oppK, t0);
      const beatsDurStr = beatsDate != null ? fracDur(pf, beatsDate) : null;
      const beatsStr = beatsDate != null
        ? `<span style="color:${beatsDate<=NOW_FRAC?'#34d399':'#9ca3af'}">${formatFrac(beatsDate)}${beatsDate<=NOW_FRAC?' ✓':''}</span>`
          + (beatsDurStr ? `<br><span style="color:#4b5563;font-size:9px">${beatsDurStr}</span>` : '')
        : `<span style="color:#6b7280">&gt;2060</span>`;
      html += `<tr>
        <td class="left" style="color:${PROP_COLORS[d.id]}">${d.name}</td>
        <td>${beStr}</td>
        <td>${beatsStr}</td>
        <td style="color:#f59e0b;cursor:help"
            onmouseenter="showKNKDetailTooltip(event,'${d.id}')"
            onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()">${fe(knk,2)}${privBadge}</td>
        <td style="cursor:help" onmouseenter="showBERepairTooltip(event,'${d.id}',${ovf})"
            onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()">${fe(netRepairs,2)}${ovfBadge}</td>
        <td style="color:#9ca3af">${eq>0?fe(eq):'—'}</td>
        <td style="color:#fbbf24;font-weight:600">${fe(Math.round(tc))}</td>
        <td style="color:${pureOpCF>=0?'#34d399':'#f87171'};font-weight:600">${fe(Math.round(pureOpCF))}</td>
        <td style="min-width:100px">${progBar}</td>
      </tr>`;
    });

    // Portfolio row
    const pm = model['_portfolio'];
    const portEq = EQUITY_PAID['_portfolio'] || 0;
    const portKNK = BE_MODEL['_portfolio'].knk;
    const portTC = BE_TOTAL_MODEL['_portfolio'].totalCapital;
    const portNetRepairs = portTC - portKNK - portEq;
    const portGrossReturn = beCumAtFrac(BE_MODEL['_portfolio'], NOW_FRAC) + portKNK;
    const portPureOpCF = portGrossReturn + cumRepairsAtFrac('_portfolio', NOW_FRAC);
    // Undo PRIV_LOANS adjustment for portfolio progress bar (same logic as per-property)
    const portPrivTi = Object.values(PRIV_LOANS).reduce((s, pl) => s + privCumTilgung(pl, NOW_FRAC), 0);
    const portPrivAmt = Object.values(PRIV_LOANS).reduce((s, pl) => s + pl.amount, 0);
    const portProgressGrossReturn = portGrossReturn + portPrivTi;
    const portProgressKNK = portKNK + portPrivAmt;
    const portProgressBase = progressVsKNK ? portProgressKNK : portTC;
    const portPct = portProgressBase > 0 ? Math.max(0, Math.min(100, 100 * portProgressGrossReturn / portProgressBase)) : 0;
    const portBar = `<div style="background:#374151;border-radius:4px;height:8px;width:100%;min-width:80px">`
      +`<div style="background:${portPct>=100?'#34d399':'#60a5fa'};width:${portPct.toFixed(0)}%;height:8px;border-radius:4px"></div>`
      +`</div><span style="font-size:9px;color:#9ca3af">${portPct.toFixed(0)}%</span>`;
    const portBEStr = pm.be != null ? formatFrac(pm.be) : '>2060';
    const portOppK = purchaseYearOppK('_portfolio');
    const portT0 = BE_MODEL['_portfolio'].pts[0].y;
    const portBeatsDate = findBeatsOppDate(BE_MODEL['_portfolio'], portOppK, portT0);
    const portBeatsStr = portBeatsDate != null ? formatFrac(portBeatsDate) : '>2060';
    html += `<tr class="total">
      <td class="left">PORTFOLIO</td>
      <td style="color:#9ca3af">${portBEStr}</td>
      <td style="color:#9ca3af">${portBeatsStr}</td>
      <td style="color:#f59e0b">${fe(Math.round(portKNK))}</td>
      <td style="color:#9ca3af">${fe(Math.round(portNetRepairs))}</td>
      <td style="color:#9ca3af">${fe(portEq)}</td>
      <td style="color:#fbbf24;font-weight:600">${fe(Math.round(portTC))}</td>
      <td style="color:${portPureOpCF>=0?'#34d399':'#f87171'};font-weight:600">${fe(Math.round(portPureOpCF))}</td>
      <td style="min-width:100px">${portBar}</td>
    </tr></tbody></table>`;
    wrap.innerHTML = html;
    return wrap;
  }

  // Compute shared X range across both models so the charts are directly comparable
  const allItems = [...makeBeItems(BE_MODEL), ...makeBeItems(BE_TOTAL_MODEL)];
  const sharedMinX = Math.floor(Math.min(...allItems.map(it => it.model.pts[0].y)));
  const allBE = allItems.filter(it => it.model.be != null && it.model.be < 2060).map(it => it.model.be);
  const sharedMaxBE = allBE.length ? Math.max(...allBE) : NOW_FRAC;
  const sharedMaxX = Math.ceil(Math.max(sharedMaxBE, NOW_FRAC) + 1.5);

  // ── Chart 1: BE_MODEL — KNK vs. Op CF only ─────────────────────────────────
  // Tilgung (equity) and asset generation cancel out exactly → excluded from both sides.
  const c1 = document.createElement('div');
  c1.className = 'card chart-wrap'; c1.style.marginBottom = '16px';
  c1.innerHTML = '<div class="chart-title">Break-Even: KNK vs. Cumulative Op CF</div>'
    +'<div class="chart-sub">Each line shows cumulative operating cash flow (rent + NK − Hausgeld − Grundsteuer − Zinsen − Rücklage − private-loan repayment, excl. mortgage Tilgung) minus Kaufnebenkosten. '
    +'Tilgung is excluded: it builds equity, but that equity is offset by the corresponding asset value — the two cancel. '
    +'Initial renovation/furnishing (fur) is included in Op CF for this chart. '
    +'Crossing y = 0 (green line) = break-even on pure operating returns. '
    +'Solid = historical actuals (DKB CSV + invoices through 2025), dashed = projected from 2026. Filled circle = break-even date.</div>';
  const beItems1 = makeBeItems(BE_MODEL);
  c1.appendChild(makeBreakEvenChart({items:beItems1, W:900, xMin:sharedMinX, xMax:sharedMaxX}));
  c1.appendChild(makeBeTable(beItems1, BE_MODEL, true));
  sec.appendChild(c1);

  // ── Chart 2: BE_TOTAL_MODEL — Op CF vs. Total Capital Employed ───────
  const c2 = document.createElement('div');
  c2.className = 'card chart-wrap'; c2.style.marginBottom = '16px';
  c2.innerHTML = '<div class="chart-title">Break-Even: Op CF vs. Total Capital Employed</div>'
    +'<div class="chart-sub">Each line shows cumulative operating CF (excl. Tilgung and initial renovation) minus all capital deployed: '
    +'Kaufnebenkosten + initial renovation/furnishing + initial equity. '
    +'Chart starts at −(KNK + equity); renovation costs are added to the capital base as incurred. '
    +'Dotted lines = 7% p.a. compound return on total capital deployed (same start date as property line). '
    +'Solid = historical, dashed = projected. Filled circle = break-even date.</div>';
  const beItems2 = makeBeItems(BE_TOTAL_MODEL);
  c2.appendChild(makeBreakEvenChart({items:beItems2, W:900, xMin:sharedMinX, xMax:sharedMaxX, showOppCost:true, capitalLabel:'Capital Employed'}));
  c2.appendChild(makeBeTable(beItems2, BE_TOTAL_MODEL, false));
  sec.appendChild(c2);

  // ── Footnotes / Assumptions ─────────────────────────────────────────────────
  const fn = document.createElement('div');
  fn.className = 'card';
  fn.style.cssText = 'margin-bottom:16px;padding:16px 20px';
  fn.innerHTML = `<div class="chart-title" style="font-size:12px;margin-bottom:8px">Calculation Assumptions</div>
<div class="footnotes" style="border-top:none;padding-top:0;margin-top:0">
<b>Data sources:</b> Actuals 2020–2025 from DKB bank statements (CSV) and invoice PDFs. Projections 2026 onwards per assumptions below.<br>
<b>Op CF components (both charts):</b> Kaltmiete + NK Vorauszahlung − Hausgeld − Grundsteuer − Zinsen (mortgage interest) − Privatkredit interest − Privatkredit repayment − Rücklage (10 €/m²/yr). Mortgage Tilgung excluded (builds equity ↔ offsets asset value, net zero).<br>
<b>Chart 1 — KNK:</b> Op CF includes initial renovation/furnishing (fur) as an operating outflow. Starting deficit = Kaufnebenkosten (net of any private loan financing the KNK).<br>
<b>Chart 2 — Total Capital:</b> Initial renovation/furnishing is reclassified as capital deployed (not Op CF). Starting deficit = KNK + initial equity paid in; renovation costs added to capital base as incurred. Dotted opp-cost lines start at the same point as the property line (−total capital).<br>
<b>KNK netting:</b> Eschweiler KNK is shown net of the DSL Bank Privatkredit (€13,000 @ 3.24% p.a., 120 months, Jan 2021–Dec 2030) that financed it — own capital deployed was €102.49. Privatkredit repayment is counted as Op CF cost (does not build property equity).<br>
<b>Rent projections (2026+):</b> +2.0%/yr per property (Kaltmiete + NK).<br>
<b>Cost projections (2026+):</b> Hausgeld +2.0%/yr; Other operating costs +2.0%/yr.<br>
<b>Mortgage interest:</b> Property-specific fixed rates. Eschweiler (Volksbank) fixed through 2035. Frankfurt properties (Hügelstr, Ohmstr) refinanced at lower prevailing rate from 2026. Berlin (DKB) per loan schedule.<br>
<b>Rücklage (maintenance reserve):</b> 10 €/m²/yr ongoing for all properties. Initial renovation (fur) is a one-time cost, separate from ongoing maintenance.<br>
<b>Vacancy:</b> 3% for Eschweiler (small city), 0% for all other properties.
</div>`;
  sec.appendChild(fn);
}

// ─── TAB SWITCHING ───────────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector(`[onclick="showTab('${id}')"]`).classList.add('active');
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderOverview();
renderDetail();
renderMortgages();
renderMarketValue();
renderBreakEven();
</script>
</body>
</html>
