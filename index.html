.grid{display:grid;gap:12px}
.g6{grid-template-columns:repeat(6,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}

.card{background:#1f2937;border:1px solid #374151;border-radius:10px;padding:14px 16px}

.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:7px 10px;color:#9ca3af;font-weight:500;text-align:right;border-bottom:2px solid #374151;white-space:nowrap}
th.left{text-align:left}
td{padding:6px 10px;border-bottom:1px solid #374151;text-align:right;font-variant-numeric:tabular-nums}
td.left{text-align:left;font-weight:600;color:#fff}
tr:nth-child(even) td{background:#2a3441}
tr.total td{background:#374151;font-weight:700;border-top:2px solid #6b7280}

function derive(p) {
  const tot  = p.km + p.nk;
  const opex = p.hg + p.gs + p.ox;
  const mort = p.zi + p.ti;
  const gp   = tot - opex;
  const np   = gp - mort;
  const cf   = tot - opex - mort;
  const tr   = cf + p.ti;

  // Return metrics: passed through directly from Notion KPIs & Metrics (2025 Actual).
  // Source: https://www.notion.so/35496be88787810ab48eebb2f1844547
  // Do NOT recompute these — always source from Notion.
  const grossRentalYieldPct = p.grossRentalYield ?? null;
  const netRentalYieldPct   = p.netRentalYield   ?? null;
  const roePct              = p.roe              ?? null;

  return { ...p, tot, opex, mort, gp, np, cf, tr,
    grossRentalYieldPct, netRentalYieldPct, roePct,
    dscr:  gp/mort,
    ptr:   p.pp ? p.pp/(p.km*12) : null,
    ppSqm: (p.pp && p.size) ? Math.round(p.pp / p.size) : null,
    kmSqm: p.size ? +(p.km / p.size).toFixed(2) : null };
}

// ─── HELPERS ────────────────────────────────────────────────────────────────
const f  = (v,d=0) => v===null||v===undefined ? '—'
  : new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const fe = (v,d=0) => v===null ? '—' : '€\u202f'+f(v,d);
const fp = (v,d=1) => v===null ? '—' : f(v,d)+'\u202f%';
const fs = (v) => {  // short for axes
  const av = Math.abs(v);
  if (av >= 1000) return (v/1000).toFixed(1)+'k';
  return Math.round(v).toString();
};
const vc = (v) => v===null ? '#9ca3af' : v>=0 ? '#34d399' : '#f87171';
const bc = (v) => v>=0 ? '#34d399' : '#f87171';

// ─── SVG CHART ENGINE ───────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}, text) {
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
  if (text !== undefined) e.textContent = text;
  return e;
}

function makeChart({ data, W=480, H=210, ml=56, mr=14, mt=16, mb=36, unit='€', label='' }) {
  // data: [{name, bars:[{label,value,color}]}]
  const iW = W-ml-mr, iH = H-mt-mb;

  // Find value range
  const allVals = data.flatMap(d =>
    [ d.bars.filter(b=>b.value>0).reduce((s,b)=>s+b.value,0),
      d.bars.filter(b=>b.value<0).reduce((s,b)=>s+b.value,0) ]);
  const maxV = Math.max(0,...allVals);
  const minV = Math.min(0,...allVals);
  const range = maxV - minV || 1;

  const yPx = v => mt + (1-(v-minV)/range)*iH;
  const zeroY = yPx(0);
  const groupW = iW / data.length;
  const barW = Math.min(groupW*0.62, 56);

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', style:'overflow:visible;display:block'});

  // Grid lines + y-axis labels
  const ticks = 5;
  for (let i=0; i<=ticks; i++) {
    const v = minV + (range/ticks)*i;
    const y = yPx(v);
    svg.appendChild(el('line', {x1:ml,y1:y,x2:W-mr,y2:y,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text', {x:ml-5,y:y+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'}, fs(v)));
  }

  // Zero line
  svg.appendChild(el('line', {x1:ml,y1:zeroY,x2:W-mr,y2:zeroY,stroke:'#6b7280','stroke-width':'1.5'}));

  // Bars
  data.forEach((d, i) => {
    const cx = ml + groupW*(i+0.5);
    let posTop = zeroY, negBot = zeroY;

    d.bars.forEach(b => {
      if (b.value === 0) return;
      const h = Math.abs(b.value/range*iH);
      const y = b.value>=0 ? posTop-h : negBot;
      const rect = el('rect', {x:cx-barW/2, y, width:barW, height:h, fill:b.color, rx:'2'});
      const title = document.createElementNS(NS,'title');
      title.textContent = `${b.label||d.name}: ${unit}${f(b.value)}`;
      rect.appendChild(title);
      // Hover tooltip
      rect.addEventListener('mouseenter', function(e) {
        showTooltip(e, `<b>${d.name}</b><br/>${b.label}: ${unit}${f(b.value)}`);
      });
      rect.addEventListener('mousemove', moveTooltip);
      rect.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(rect);
      if (b.value>=0) posTop-=h; else negBot+=h;
    });

    // X label
    svg.appendChild(el('text', {x:cx, y:H-mb+14,'text-anchor':'middle',fill:'#9ca3af','font-size':'10'}, d.name));
  });

  // Y-axis label
  if (label) {
    const t = el('text', {x:8, y:mt+iH/2, 'text-anchor':'middle', fill:'#6b7280','font-size':'9',
      transform:`rotate(-90,8,${mt+iH/2})`}, label);
    svg.appendChild(t);
  }

  return svg;
}

// Grouped bar chart (multiple bars side by side per group)
function makeGroupedChart({ data, keys, colors, colorFns, W=480, H=210, ml=56, mr=14, mt=16, mb=36, unit='' }) {
  const iW = W-ml-mr, iH = H-mt-mb;
  const allVals = data.flatMap(d => keys.map(k => d[k]||0));
  const maxV = Math.max(0,...allVals);
  const minV = Math.min(0,...allVals);
  const range = maxV - minV || 1;
  const yPx = v => mt + (1-(v-minV)/range)*iH;
  const zeroY = yPx(0);
  const groupW = iW / data.length;
  const bw = Math.min(groupW*0.75/keys.length, 40);
  const gap = bw*0.25;

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', style:'overflow:visible;display:block'});

  // Grid + labels
  for (let i=0; i<=5; i++) {
    const v = minV + (range/5)*i;
    const y = yPx(v);
    svg.appendChild(el('line', {x1:ml,y1:y,x2:W-mr,y2:y,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text', {x:ml-5,y:y+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'}, fs(v)+(unit?unit:'')));
  }
  svg.appendChild(el('line', {x1:ml,y1:zeroY,x2:W-mr,y2:zeroY,stroke:'#6b7280','stroke-width':'1.5'}));

  // Reference line DSCR=1
  if (unit==='x') {
    const ry = yPx(1);
    svg.appendChild(el('line', {x1:ml,y1:ry,x2:W-mr,y2:ry,stroke:'#fbbf24','stroke-width':'1',
      'stroke-dasharray':'5,3'}));
    svg.appendChild(el('text', {x:W-mr+2,y:ry+3,fill:'#fbbf24','font-size':'8'}, '1.0'));
  }

  data.forEach((d, i) => {
    const cx = ml + groupW*(i+0.5) - (keys.length-1)*(bw+gap)/2;
    keys.forEach((k, ki) => {
      const v = d[k] !== undefined ? d[k] : 0;
      if (v===0) return;
      const h = Math.abs(v/range*iH);
      const y = v>=0 ? zeroY-h : zeroY;
      const x = cx + ki*(bw+gap) - bw/2;
      // colorFns[ki] allows per-value color (e.g. green/red by sign); falls back to colors[ki]
      const fill = (colorFns && colorFns[ki]) ? colorFns[ki](v) : (colors[ki]||'#60a5fa');
      const rect = el('rect', {x, y, width:bw, height:h, fill, rx:'2'});
      rect.addEventListener('mouseenter', e => showTooltip(e, `<b>${d.name}</b><br/>${k}: ${f(v,2)}${unit}`));
      rect.addEventListener('mousemove', moveTooltip);
      rect.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(rect);
    });
    svg.appendChild(el('text', {x:ml+groupW*(i+0.5),y:H-mb+14,'text-anchor':'middle',fill:'#9ca3af','font-size':'10'}, d.name));
  });
  return svg;
}

// Line chart for time-series data (market value development)
function makeLineChart({ series, W=900, H=260, ml=72, mr=130, mt=20, mb=36, unit='€' }) {
  const iW = W-ml-mr, iH = H-mt-mb;
  const allX = series.flatMap(s => s.points.map(p => p.x));
  const allY = series.flatMap(s => s.points.map(p => p.y));
  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const minY = 0, maxY = Math.max(...allY) * 1.05;
  const rangeX = maxX - minX || 1, rangeY = maxY - minY || 1;
  const xPx = x => ml + (x - minX) / rangeX * iW;
  const yPx = y => mt + (1 - (y - minY) / rangeY) * iH;

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', style:'overflow:visible;display:block'});

  // Grid + Y labels
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const v = minY + (maxY - minY) / ticks * i;
    const py = yPx(v);
    svg.appendChild(el('line', {x1:ml,y1:py,x2:W-mr,y2:py,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text', {x:ml-5,y:py+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'}, fs(v)));
  }

  // Vertical year lines + X labels
  for (let x = minX; x <= maxX; x++) {
    const px = xPx(x);
    svg.appendChild(el('line', {x1:px,y1:mt,x2:px,y2:H-mb,stroke:'#374151','stroke-dasharray':'2,4'}));
    svg.appendChild(el('text', {x:px,y:H-mb+12,'text-anchor':'middle',fill:'#9ca3af','font-size':'9'}, x));
  }

  // "Now" marker (May 2026)
  const NOW_X = 2026 + 4/12;
  const nowPx = xPx(NOW_X);
  svg.appendChild(el('line', {x1:nowPx,y1:mt,x2:nowPx,y2:H-mb,stroke:'#fbbf24','stroke-width':'1.5','stroke-dasharray':'5,3'}));
  svg.appendChild(el('text', {x:nowPx+3,y:mt+9,fill:'#fbbf24','font-size':'8'}, 'May 2026'));

  // Draw each series
  series.forEach(s => {
    const pts = s.points;
    for (let i = 0; i < pts.length - 1; i++) {
      const p1 = pts[i], p2 = pts[i+1];
      const attrs = {
        x1: xPx(p1.x), y1: yPx(p1.y), x2: xPx(p2.x), y2: yPx(p2.y),
        stroke: s.color, 'stroke-width': s.thick ? '2.5' : '1.5',
      };
      if (p2.projected) attrs['stroke-dasharray'] = '6,3';
      svg.appendChild(el('line', attrs));
    }
    // Dots
    pts.forEach(p => {
      const c = el('circle', {cx:xPx(p.x), cy:yPx(p.y), r: s.thick?'4':'3',
        fill:s.color, opacity:p.projected?'0.7':'1'});
      c.addEventListener('mouseenter', e => showTooltip(e,
        `<b>${s.name}</b><br/>${p.x}: ${unit}${f(p.y)}${p.projected?' <span style="color:#fbbf24">(projected)</span>':''}`));
      c.addEventListener('mousemove', moveTooltip);
      c.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(c);
    });
    // End label
    if (pts.length > 0) {
      const last = pts[pts.length-1];
      svg.appendChild(el('text', {x:xPx(last.x)+5, y:yPx(last.y)+3,
        fill:s.color, 'font-size': s.thick?'10':'9', 'font-weight': s.thick?'700':'400'}, s.name));
    }
  });

  return svg;
}

// Waterfall / bridge chart — each bar floats from running total of previous bars
function makeWaterfallChart({ steps, W=420, H=280, ml=64, mr=14, mt=20, mb=68 }) {
  const iW=W-ml-mr, iH=H-mt-mb;
  // Build bars with start/end positions
  let run=0;
  const bars=steps.map(s=>{
    const s0=s.isTotal?0:run;
    const s1=s.isTotal?s.value:run+s.value;
    if(!s.isTotal) run+=s.value;
    return{...s,s0,s1};
  });
  const allV=bars.flatMap(b=>[b.s0,b.s1]);
  const rawMax=Math.max(0,...allV), rawMin=Math.min(0,...allV);
  const pad=(rawMax-rawMin)*0.14;
  const maxV=rawMax+pad, minV=rawMin-pad;
  const range=maxV-minV||1;
  const yPx=v=>mt+(1-(v-minV)/range)*iH;
  const z=yPx(0);
  const gW=iW/bars.length, bW=Math.min(gW*0.62,44);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:'overflow:visible;display:block'});
  // Grid
  for(let i=0;i<=5;i++){
    const v=minV+(range/5)*i, y=yPx(v);
    svg.appendChild(el('line',{x1:ml,y1:y,x2:W-mr,y2:y,stroke:'#374151','stroke-dasharray':'3,3'}));
    svg.appendChild(el('text',{x:ml-5,y:y+3,'text-anchor':'end',fill:'#9ca3af','font-size':'9'},fs(v)));
  }
  if(minV<0&&maxV>0) svg.appendChild(el('line',{x1:ml,y1:z,x2:W-mr,y2:z,stroke:'#6b7280','stroke-width':'1.5'}));
  bars.forEach((b,i)=>{
    const cx=ml+gW*(i+0.5), x=cx-bW/2;
    const top=yPx(Math.max(b.s0,b.s1)), bot=yPx(Math.min(b.s0,b.s1)), h=Math.max(2,bot-top);
    const fill=b.isTotal?(b.value>=0?'#34d399':'#f87171'):(b.color||(b.value>=0?'#34d399':'#dc2626'));
    // Connector line to next bar
    if(i<bars.length-1){
      const nCx=ml+gW*(i+1.5);
      svg.appendChild(el('line',{x1:cx+bW/2,y1:yPx(b.s1),x2:nCx-bW/2,y2:yPx(b.s1),
        stroke:'#4b5563','stroke-width':'1','stroke-dasharray':'3,2'}));
    }
    const rect=el('rect',{x,y:top,width:bW,height:h,fill,rx:'2',opacity:'0.9'});
    rect.addEventListener('mouseenter',e=>showTooltip(e,`<b>${b.label}</b><br/>€${f(b.value)}`));
    rect.addEventListener('mousemove',moveTooltip);
    rect.addEventListener('mouseleave',hideTooltip);
    svg.appendChild(rect);
    // Value label above/below bar
    const lv=b.value>=0?top-3:bot+10;
    svg.appendChild(el('text',{x:cx,y:lv,'text-anchor':'middle',fill:fill,
      'font-size':'9','font-weight':'600'},fs(b.value)));
    // Rotated x-axis label
    svg.appendChild(el('text',{x:cx,y:H-mb+12,'text-anchor':'end',fill:'#9ca3af','font-size':'9',
      transform:`rotate(-40,${cx},${H-mb+12})`},b.label));
  });
  return svg;
}

// Helper: decimal year fraction → "Mon YYYY"
function formatFrac(frac) {
  const yr = Math.floor(frac);
  const mo = Math.round((frac - yr) * 12) + 1;
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Math.min(mo-1,11)]+' '+yr;
}

// ── Break-Even Line Chart ─────────────────────────────────────────────────────
// propData: [{id, label, color, rows}] where rows are AT_BE records for that property.
// Solid line = Actual beAll, dashed = last Actual → Projected beAll, dotted = oppCost (all rows, 0.45 opacity).
function makeBreakEvenLineChart({propData, W=900, H=340, ml=75, mr=140, mt=20, mb=35}) {
  const iW = W - ml - mr;
  const iH = H - mt - mb;

  // X range
  const allYears = propData.flatMap(p => p.rows.map(r => r.year));
  const minX = Math.min(...allYears);
  const maxX = Math.max(...allYears);

  // Y range (include oppCost in min, only beAll in max)
  const allBeAll = propData.flatMap(p => p.rows.map(r => r.beAll));
  const allOpp   = propData.flatMap(p => p.rows.map(r => r.oppCost));
  const rawMin = Math.min(...allBeAll, ...allOpp);
  const rawMax = Math.max(...allBeAll, 0);
  const pad = (rawMax - rawMin) * 0.07;
  const minY = rawMin - pad;
  const maxY = rawMax + pad;
  const rangeY = maxY - minY;

  // Nice grid step (round to nearest 5000 or 10000)
  const roughStep = (maxY - minY) / 6;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(roughStep) || 1)));
  const niceStep = Math.ceil(roughStep / (mag * 5)) * mag * 5 || 5000;

  const xPx = x => ml + (x - minX) / (maxX - minX) * iW;
  const yPx = y => mt + (1 - (y - minY) / rangeY) * iH;
  const zeroY = yPx(0);

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', style:'overflow:visible;display:block'});

  // Y grid lines + labels
  for (let v = Math.ceil(minY / niceStep) * niceStep; v <= maxY + niceStep * 0.5; v += niceStep) {
    const py = yPx(v);
    if (py < mt - 2 || py > H - mb + 2) continue;
    svg.appendChild(el('line', {x1:ml, y1:py, x2:W-mr, y2:py, stroke:'#374151', 'stroke-dasharray':'3,3'}));
    svg.appendChild(el('text', {x:ml-5, y:py+3, 'text-anchor':'end', fill:'#9ca3af', 'font-size':'9'}, fs(v)));
  }

  // Break-even zero line
  if (zeroY >= mt - 1 && zeroY <= H - mb + 1) {
    svg.appendChild(el('line', {x1:ml, y1:zeroY, x2:W-mr, y2:zeroY, stroke:'#34d399', 'stroke-width':'1.5'}));
    svg.appendChild(el('text', {x:ml-5, y:zeroY-4, 'text-anchor':'end', fill:'#34d399', 'font-size':'8', 'font-weight':'600'}, 'Break-even'));
  }

  // X year ticks
  const span = maxX - minX;
  for (let yr = minX; yr <= maxX; yr++) {
    const px = xPx(yr);
    svg.appendChild(el('line', {x1:px, y1:mt, x2:px, y2:H-mb, stroke:'#374151', 'stroke-dasharray':'2,4'}));
    if (span <= 12 || yr % 2 === 0) {
      svg.appendChild(el('text', {x:px, y:H-mb+13, 'text-anchor':'middle', fill:'#9ca3af', 'font-size':'9'}, yr));
    }
  }

  // 2026 "current year" marker
  const nowPx = xPx(2026);
  if (nowPx >= ml && nowPx <= W - mr) {
    svg.appendChild(el('line', {x1:nowPx, y1:mt, x2:nowPx, y2:H-mb, stroke:'#fbbf24', 'stroke-width':'1.5', 'stroke-dasharray':'5,3'}));
    svg.appendChild(el('text', {x:nowPx+3, y:mt+11, fill:'#fbbf24', 'font-size':'8'}, '2026 →'));
  }

  // Per-property groups
  propData.forEach((pd, idx) => {
    const { id, label, color, rows } = pd;

    const propGroup = el('g');
    propGroup.setAttribute('data-prop', id);
    svg.appendChild(propGroup);

    const actuals   = rows.filter(r => r.source === 'Actual');
    const projected = rows.filter(r => r.source === 'Projected');

    // Solid polyline — Actual beAll
    if (actuals.length >= 2) {
      const pts = actuals.map(r => xPx(r.year).toFixed(1)+','+yPx(r.beAll).toFixed(1)).join(' ');
      propGroup.appendChild(el('polyline', {points:pts, stroke:color, 'stroke-width':'2.5', fill:'none', 'stroke-linejoin':'round'}));
    }

    // Actual point circles (filled)
    actuals.forEach(r => {
      const c = el('circle', {cx:xPx(r.year).toFixed(1), cy:yPx(r.beAll).toFixed(1), r:'3.5', fill:color, stroke:'#111827', 'stroke-width':'1.2'});
      const pct = (r.progress * 100).toFixed(0);
      c.addEventListener('mouseenter', e2 => showTooltip(e2,
        `<b>${label} ${r.year}</b> (Actual)<br/>Break Even: ${fe(Math.round(r.beAll))}<br/>Opp. Cost (7%): ${fe(Math.round(r.oppCost))}<br/>Progress: ${pct}%`));
      c.addEventListener('mousemove', moveTooltip);
      c.addEventListener('mouseleave', hideTooltip);
      propGroup.appendChild(c);
    });

    // Dashed polyline — last Actual point → all Projected beAll (connected, no gap)
    const dashRows = actuals.length ? [actuals[actuals.length-1], ...projected] : projected;
    if (dashRows.length >= 2) {
      const pts = dashRows.map(r => xPx(r.year).toFixed(1)+','+yPx(r.beAll).toFixed(1)).join(' ');
      propGroup.appendChild(el('polyline', {points:pts, stroke:color, 'stroke-width':'1.8', 'stroke-dasharray':'6,3', fill:'none', 'stroke-linejoin':'round'}));
    }

    // Projected point circles (hollow)
    projected.forEach(r => {
      const c = el('circle', {cx:xPx(r.year).toFixed(1), cy:yPx(r.beAll).toFixed(1), r:'3', fill:'#111827', stroke:color, 'stroke-width':'1.5'});
      const pct = (Math.min(1, r.progress) * 100).toFixed(0);
      c.addEventListener('mouseenter', e2 => showTooltip(e2,
        `<b>${label} ${r.year}</b> (Projected)<br/>Break Even: ${fe(Math.round(r.beAll))}<br/>Opp. Cost (7%): ${fe(Math.round(r.oppCost))}<br/>Progress: ${pct}%`));
      c.addEventListener('mousemove', moveTooltip);
      c.addEventListener('mouseleave', hideTooltip);
      propGroup.appendChild(c);
    });

    // Thin dotted oppCost polyline — all rows
    if (rows.length >= 2) {
      const pts = rows.map(r => xPx(r.year).toFixed(1)+','+yPx(r.oppCost).toFixed(1)).join(' ');
      const oLine = el('polyline', {points:pts, stroke:color, 'stroke-width':'1', 'stroke-dasharray':'2,4', fill:'none', opacity:'0.45'});
      oLine.addEventListener('mouseenter', e2 => showTooltip(e2,
        `<b>${label} — Opportunity Cost (7% p.a.)</b><br/>What total capital deployed would have grown to<br/>if invested in equities at 7% p.a. instead.`));
      oLine.addEventListener('mousemove', moveTooltip);
      oLine.addEventListener('mouseleave', hideTooltip);
      propGroup.appendChild(oLine);
    }

    // Break-even crossing marker: interpolate between last row with beAll < 0 and first with beAll >= 0
    let beCrossX = null;
    for (let i = 0; i < rows.length - 1; i++) {
      if (rows[i].beAll < 0 && rows[i+1].beAll >= 0) {
        const t = -rows[i].beAll / (rows[i+1].beAll - rows[i].beAll);
        beCrossX = rows[i].year + t * (rows[i+1].year - rows[i].year);
        break;
      }
    }
    if (beCrossX === null && rows.length && rows[0].beAll >= 0) beCrossX = rows[0].year;
    if (beCrossX !== null && xPx(beCrossX) >= ml && xPx(beCrossX) <= W - mr) {
      const beYrLabel = beCrossX % 1 < 0.05 ? Math.round(beCrossX) : beCrossX.toFixed(1);
      const bDot = el('circle', {cx:xPx(beCrossX).toFixed(1), cy:zeroY.toFixed(1), r:'5', fill:color, stroke:'#111827', 'stroke-width':'1.5'});
      bDot.addEventListener('mouseenter', e2 => showTooltip(e2,
        `<b>${label}</b><br/>Break-even: <b>${beYrLabel}</b><br/><span style="color:#34d399">✓ Cumulative CF crosses 0</span>`));
      bDot.addEventListener('mousemove', moveTooltip);
      bDot.addEventListener('mouseleave', hideTooltip);
      propGroup.appendChild(bDot);
    }

    // Legend entry (clickable toggle)
    const legY = mt + 18 + idx * 34;
    const legGroup = el('g');
    legGroup.style.cursor = 'pointer';
    legGroup.title = 'Click to show/hide';
    let hidden = false;
    // solid swatch
    legGroup.appendChild(el('line', {x1:W-mr+8, y1:legY-5, x2:W-mr+22, y2:legY-5, stroke:color, 'stroke-width':'2.5'}));
    // dotted swatch (oppCost)
    legGroup.appendChild(el('line', {x1:W-mr+8, y1:legY+3, x2:W-mr+22, y2:legY+3, stroke:color, 'stroke-width':'1', 'stroke-dasharray':'2,3', opacity:'0.5'}));
    const ln1 = el('text', {x:W-mr+26, y:legY, fill:'#d1d5db', 'font-size':'10'});
    ln1.textContent = label;
    const beRow = rows.find(r => r.beAll >= 0);
    const ln2 = el('text', {x:W-mr+26, y:legY+12, fill:'#6b7280', 'font-size':'9'});
    ln2.textContent = beRow ? 'BE: '+beRow.year : 'BE: >2035';
    legGroup.appendChild(ln1);
    legGroup.appendChild(ln2);
    legGroup.addEventListener('click', () => {
      hidden = !hidden;
      propGroup.style.opacity = hidden ? '0.1' : '1';
      legGroup.setAttribute('opacity', hidden ? '0.3' : '1');
    });
    svg.appendChild(legGroup);
  });

  return svg;
}


// ─── TOOLTIP ────────────────────────────────────────────────────────────────
const TT = document.getElementById('tooltip');
function showTooltip(e, html) { TT.innerHTML=html; TT.style.display='block'; moveTooltip(e); }
function moveTooltip(e) {
  const r = document.body.getBoundingClientRect();
  TT.style.left = (e.clientX - r.left + 12)+'px';
  TT.style.top  = (e.clientY - r.top  - 8)+'px';
}
function hideTooltip() { TT.style.display='none'; }
function showKNKDetailTooltip(e, id) {
  const items = KNK_DETAIL[id] || [];
  const rows = items.map(t => `${t.category} (${t.party}), ${t.date}: <b>${fe(t.amount,2)}</b>`).join('<br/>');
  const total = items.reduce((s,t)=>s+t.amount,0);
  showTooltip(e, `<b>KNK — ${id.charAt(0).toUpperCase()+id.slice(1)} Breakdown</b><br/>${rows}<br/><hr style="border-color:#374151;margin:4px 0"/><b>Total: ${fe(total,2)}</b>`);
}
function showRepairDetailTooltip(e, id, year) {
  const all = REPAIRS_DETAIL[id] || [];
  const items = year ? all.filter(t => parseInt(t.date.slice(-4)) === year) : all;
  if (!items.length) return;
  const rows = items.map(t => `${t.desc} (${t.party}), ${t.date}: <b>${fe(t.amount,2)}</b>`).join('<br/>');
  const total = items.reduce((s,t)=>s+t.amount,0);
  const name = id.charAt(0).toUpperCase()+id.slice(1);
  const hdr = year ? `${name} ${year}` : name;
  showTooltip(e, `<b>Repair &amp; Maintenance — ${hdr} (invoices on file)</b><br/>${rows}<br/><hr style="border-color:#374151;margin:4px 0"/><b>Total invoiced: ${fe(total,2)}</b><br/><span style="color:#6b7280;font-size:10px">CSV accounting total may differ</span>`);
}
function showFurTooltip_BE(e, id) {
  const AT_FUR_NAMES = {berlin:'Berlin', eschweiler:'Eschweiler', huegelstr:'Hügelstr (EG+Mansarde)', ohmstr:'Ohmstraße', leipzig:'Leipzig'};
  const items = AT_FUR_DETAIL[id] || [];
  const rows = items.map(t => `${t.desc} (${t.party}), ${t.date}: <b>${fe(t.amount,2)}</b>`).join('<br/>');
  const total = items.reduce((s,t) => s + t.amount, 0);
  showTooltip(e, `<b>Initial Furnishing &amp; Renovation — ${AT_FUR_NAMES[id]||id}</b><br/>${rows}<hr style="border-color:#374151;margin:4px 0"/><b>Total: ${fe(total,2)}</b>`);
}

}

    <b>Net Rental Yield</b> = ((Warmmiete − Hausgeld − Grundsteuer − Ø monthly repair) × 12) / (Kaufpreis + KNK). Sourced from Notion KPIs &amp; Metrics (2025 Actual).<br>

    Grundsteuer &amp; DKB fees are quarterly amounts ÷ 3. Tax effects (AfA, Werbungskosten) not reflected here.`;
  sec.appendChild(fn);
}

function renderMortgages() {
  const sec = document.getElementById('mortgages');

  const mortKpis = D.map(d => {
    const md = MORTGAGE_DATA[d.id];
    const remaining = md.loanAmt - md.tilgungPaid;
    const equity    = d.pp - remaining;
    const equityPct = d.pp ? equity / d.pp * 100 : null;
    const ltv       = d.pp ? remaining / d.pp * 100 : null;
    // Use mortgage-only zi/ti if stored (e.g. Eschweiler Volksbank only, excl. DSL Privatkredit)
    const mZi = md.zi !== undefined ? md.zi : d.zi;
    const mTi = md.ti !== undefined ? md.ti : d.ti;
    return { ...d, ...md, remaining, equity, equityPct, ltv, mZi, mTi, mMort: mZi+mTi };
  });

  const totalLoan       = mortKpis.reduce((s,m) => s + m.loanAmt, 0);
  const totalTilgungPd  = mortKpis.reduce((s,m) => s + m.tilgungPaid, 0);
  const totalRemaining  = mortKpis.reduce((s,m) => s + m.remaining, 0);
  const totalPP         = D.reduce((s,d) => s + d.pp, 0);
  const totalEquity     = totalPP - totalRemaining;
  const portfolioLTV    = totalRemaining / totalPP * 100;

  // KPI row
  const r1 = document.createElement('div');
  r1.className='grid g4'; r1.style.marginBottom='12px';
  r1.innerHTML = [
    kpiCard('Portfolio Cost Basis', fe(totalPP), 'Sum of purchase prices', '#f9fafb'),
    kpiCard('Remaining Debt', fe(Math.round(totalRemaining)), fp(portfolioLTV,1)+' LTV', '#f87171', true),
    kpiCard('Total Equity', fe(Math.round(totalEquity)), fp(100-portfolioLTV,1)+' of portfolio', '#34d399', true),
    kpiCard('Portfolio LTV', fp(portfolioLTV,1), '< 80% conventional comfort zone', portfolioLTV<=80?'#34d399':portfolioLTV<=90?'#fbbf24':'#f87171', true),
  ].join('');
  sec.appendChild(r1);

  // Stacked bar: equity vs remaining debt
  const ebCard = document.createElement('div');
  ebCard.className='card chart-wrap'; ebCard.style.marginBottom='16px';
  ebCard.innerHTML='<div class="chart-title">Equity vs Remaining Debt per Property (€)</div>'
    +'<div class="chart-sub">Green = equity (down payment + tilgung paid to date). Red = remaining loan balance.</div>';
  const ebData = mortKpis.map(m => ({name:m.name, bars:[
    {label:'Equity',         value: Math.round(m.equity),    color:'#34d399'},
    {label:'Remaining Debt', value: Math.round(m.remaining), color:'#f87171'},
  ]}));
  ebCard.appendChild(makeChart({data:ebData, unit:'€', W:700}));
  { const leg = document.createElement('div'); leg.className='legend';
    leg.innerHTML='<div class="leg-item"><div class="leg-dot" style="background:#34d399"></div>Equity (own)</div>'
      +'<div class="leg-item"><div class="leg-dot" style="background:#f87171"></div>Remaining Debt</div>';
    ebCard.appendChild(leg); }
  sec.appendChild(ebCard);

  // Mortgage detail table
  const tCard = document.createElement('div');
  tCard.className='card'; tCard.style.overflowX='auto'; tCard.style.marginBottom='16px';
  tCard.innerHTML='<div class="chart-title" style="margin-bottom:10px">Mortgage Detail</div>';
  // Payoff date: annuity formula — months until remaining balance reaches 0
  // n = −ln(1 − r·B/P) / ln(1+r), where r = monthly rate, B = balance, P = monthly payment
  function mortPayoffStr(remaining, mZi, mTi) {
    const P = mZi + mTi;
    if (remaining <= 0 || P <= 0 || mZi <= 0) return '—';
    const r = mZi / remaining;
    const arg = 1 - r * remaining / P;
    if (arg <= 0 || arg >= 1) return '—';
    const n = -Math.log(arg) / Math.log(1 + r); // months from Apr 2026
    const payoffFrac = 2026 + 3/12 + n/12;
    return formatFrac(payoffFrac);
  }

  let html = `<table><thead><tr>
    <th class="left">Property</th>
    <th>Purchase Date</th>
    <th>Purchase Price</th>
    <th>Original Loan</th>
    <th>Tilgung Paid</th>
    <th>Remaining Balance</th>
    <th>Equity €</th>
    <th>Equity %</th>
    <th>LTV %</th>
    <th>Zinsen/mo</th>
    <th>Tilgung/mo</th>
    <th>Mortgage/mo</th>
    <th>Zinsbindung bis</th>
    <th>Est. Payoff</th>
  </tr></thead><tbody>`;

  mortKpis.forEach(m => {
    const ltvColor = m.ltv<=80?'#34d399':m.ltv<=90?'#fbbf24':'#f87171';
    const payoff = mortPayoffStr(m.remaining, m.mZi, m.mTi);
    html += `<tr>
      <td class="left">${m.name}<br><span style="font-weight:400;color:#9ca3af;font-size:10px">${m.addr}</span></td>
      <td style="color:#9ca3af">${m.purchaseDate}</td>
      <td>${fe(m.pp)}</td>
      <td style="color:#a78bfa">${fe(m.loanAmt)}</td>
      <td style="color:#c084fc">${fe(Math.round(m.tilgungPaid))}</td>
      <td style="color:#f87171;font-weight:600">${fe(Math.round(m.remaining))}</td>
      <td style="color:#34d399;font-weight:600">${fe(Math.round(m.equity))}</td>
      <td style="color:${vc(m.equityPct)};font-weight:600">${fp(m.equityPct,1)}</td>
      <td style="color:${ltvColor};font-weight:600">${fp(m.ltv,1)}</td>
      <td style="color:#f87171">${fe(m.mZi,2)}</td>
      <td style="color:#c084fc">${fe(m.mTi,2)}</td>
      <td style="color:#fca5a5">${fe(m.mMort,2)}</td>
      <td style="color:#fbbf24;font-weight:600">${m.zinsbindung || '—'}</td>
      <td style="color:#818cf8;font-weight:600">${payoff}</td>
    </tr>`;
    if(m.id==='eschweiler'){
      html+=`<tr><td colspan="14" style="background:#1c2535;padding:4px 10px">
        <span style="color:#9ca3af;font-size:10px">DSL Bank Privatkredit (€13k, 3.24%, matures Dez 2030) financed the KNK. In the Break-Even model: net KNK = €102.49 (gross €13,102.49 − €13,000); Privatkredit Tilgung reduces Op CF (no property equity built). Est. Payoff above is Volksbank Immobiliar only.</span></td></tr>`;
    }
  });

  html += `<tr class="total">
    <td class="left">PORTFOLIO</td>
    <td style="color:#9ca3af">—</td>
    <td>${fe(totalPP)}</td>
    <td style="color:#a78bfa">${fe(totalLoan)}</td>
    <td style="color:#c084fc">${fe(Math.round(totalTilgungPd))}</td>
    <td style="color:#f87171;font-weight:600">${fe(Math.round(totalRemaining))}</td>
    <td style="color:#34d399;font-weight:600">${fe(Math.round(totalEquity))}</td>
    <td style="color:${vc(100-portfolioLTV)};font-weight:600">${fp(100-portfolioLTV,1)}</td>
    <td style="color:${portfolioLTV<=80?'#34d399':portfolioLTV<=90?'#fbbf24':'#f87171'};font-weight:600">${fp(portfolioLTV,1)}</td>
    <td style="color:#f87171">${fe(mortKpis.reduce((s,m)=>s+m.mZi,0),2)}</td>
    <td style="color:#c084fc">${fe(mortKpis.reduce((s,m)=>s+m.mTi,0),2)}</td>
    <td style="color:#fca5a5">${fe(mortKpis.reduce((s,m)=>s+m.mMort,0),2)}</td>
    <td style="color:#9ca3af">—</td>
    <td style="color:#9ca3af">—</td>
  </tr></tbody></table>`;

  tCard.innerHTML += html;
  sec.appendChild(tCard);

  const fn = document.createElement('div');
  fn.className='footnotes';
  fn.innerHTML = `
    <b>Equity</b> = Purchase Price − Remaining Loan Balance. Remaining Balance = Original Loan − Cumulative Tilgung paid to April 2026.<br>
    <b>LTV</b> (Loan-to-Value) = Remaining Balance / Purchase Price. Below 80% is conventional; below 60% is strong.<br>
    <b>Tilgung Paid</b> is cumulative principal repaid from loan disbursement to April 2026, extracted from DKB transaction data.<br>
    <b>Est. Payoff</b> = projected full repayment date, assuming constant monthly payment (current Zinsen + Tilgung) and current interest rate held throughout. Uses annuity formula: n = −ln(1 − r·B/P) / ln(1+r). Will change at next rate fix.<br>
    Eschweiler: Volksbank Immobiliar (€89k) only — the €3k above purchase price financed a kitchen. DSL Bank Privatkredit (€13k) is a personal loan, not a property mortgage, and is excluded from this tab. Combined monthly cost incl. DSL: Zinsen €125.29, Tilgung €270.19.<br>
    Purchase price is used as property value proxy. Actual market value may differ — see Market Value tab for appreciation estimates.`;
  sec.appendChild(fn);

// ─── MARKET VALUE TAB ────────────────────────────────────────────────────────
function renderMarketValue() {
  const sec = document.getElementById('market-value');
  sec.innerHTML = '';
  const NOW_FRAC = 2026 + 4/12; // May 2026
  const propColors = ['#60a5fa','#34d399','#f97316','#a78bfa','#f87171'];

  // Forward rates: defaults overridable via the rate editor below (localStorage)
  const userRates = JSON.parse(localStorage.getItem('re_mkt_fwdrates') || 'null') || {};
  const fwdRates  = {...FORWARD_RATES, ...userRates};

  function dateToFrac(dateStr) {
    const [y,m,d] = dateStr.split('-').map(Number);
    return y + (m-1)/12 + (d-1)/365;
  }
  function getSnapsForProp(propId) {
    return MARKET_SNAPSHOTS
      .filter(s => s.id === propId)
      .sort((a,b) => a.date.localeCompare(b.date));
  }

  // Build current values per property
  const CVS = D.map((d, i) => {
    const md    = MORTGAGE_DATA[d.id];
    const snaps = getSnapsForProp(d.id);
    const last  = snaps[snaps.length - 1];
    const cv    = last ? last.value : d.pp;
    const gainAmt = cv - d.pp;
    const gainPct = gainAmt / d.pp * 100;
    const purchFrac = parseInt(md.purchaseDate.substring(0,4)) + (parseInt(md.purchaseDate.substring(5,7))-1)/12;
    const lastFrac  = last ? dateToFrac(last.date) : NOW_FRAC;
    const yrs       = Math.max(0.01, lastFrac - purchFrac);
    const implRate  = (Math.pow(cv / d.pp, 1/yrs) - 1) * 100;
    return { ...d, cv, gainAmt, gainPct, implRate,
             snaps, last, lastFrac, purchFrac,
             forwardRate: fwdRates[d.id], color: propColors[i] };
  });

  const totalPP  = D.reduce((s,d) => s + d.pp, 0);
  const totalCV  = CVS.reduce((s,c) => s + c.cv, 0);
  const totalGn  = totalCV - totalPP;
  const totalRem = D.reduce((s,d) => s + MORTGAGE_DATA[d.id].loanAmt - MORTGAGE_DATA[d.id].tilgungPaid, 0);

  // ── KPI row ──────────────────────────────────────────────────────────────────
  const r1 = document.createElement('div');
  r1.className='grid g4'; r1.style.marginBottom='12px';
  r1.innerHTML = [
    kpiCard('Total Purchase Cost', fe(totalPP),                         'Sum of all purchase prices',               '#f9fafb'),
    kpiCard('Est. Market Value',   fe(Math.round(totalCV)),             'Immowelt €/m² × (1−8% gap) × sqm', '#60a5fa', true),
    kpiCard('Unrealised Gain/Loss',fe(Math.round(totalGn)),             fp(totalGn/totalPP*100,1)+' vs cost',       vc(totalGn), true),
    kpiCard('Real Equity (est.)',  fe(Math.round(totalCV-totalRem)),    'Est. Value − remaining debt',              '#34d399', true),
  ].join('');
  sec.appendChild(r1);

  // ── Methodology banner ───────────────────────────────────────────────────────
  const banner = document.createElement('div');
  banner.style.cssText='background:#1c2535;border:1px solid #374151;border-radius:8px;padding:12px;margin-bottom:16px;font-size:11px;color:#d1d5db';
  const lastDate = CVS.reduce((acc, c) => c.last?.date > acc ? c.last.date : acc, '');
  banner.innerHTML = `
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">
      <div>
        <span style="color:#60a5fa;font-weight:700">📊 Market Value Method:</span>
        Immowelt Stadtteil average Wohnung €/m² (asking price) × (1 − 8% asking-to-transaction gap) × floor area.
        Source: Immowelt Stadtteil price pages, updated monthly by Immowelt.
        Snapshots fetched autonomously by the quarterly scheduled task and recorded in Airtable.
        Formula: <code style="color:#fbbf24">value = pricePerSqm × 0.92 × sqm</code>
      </div>
      <div style="color:#9ca3af;font-size:10px;white-space:nowrap">Last snapshot: ${lastDate || '—'}</div>
    </div>
    <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:12px">
      ${CVS.map(c => {
        const s = c.last;
        if (!s) return `<span><b style="color:${c.color}">${c.name}</b> <span style="color:#9ca3af">no snapshot</span></span>`;
        const gap   = s.askingGap   ?? s.discount ?? 8;
        const absch = s.vermietungsAbschlag ?? 0;
        const heat  = s.heatingFactor ?? 0;
        const heatStr = heat !== 0 ? ` × (1${heat>0?'+':''}${heat}%)` : '';
        return `<span>
          <b style="color:${c.color}">${c.name}</b>
          <span style="color:#9ca3af;font-size:10px">${s.stadtteil||''} · ${s.energyClass||'?'}</span><br>
          <span style="color:#60a5fa">${c.size}m² × €${f(s.pricePerSqm)}/m²</span>
          <span style="color:#9ca3af">× (1−${gap}%) × (1−${absch}%)${heatStr}</span>
          = <span style="font-weight:600;color:#f9fafb">€${f(c.cv)}</span>
        </span>`;
      }).join('')}
    </div>`;
  sec.appendChild(banner);

  // ── Line chart ───────────────────────────────────────────────────────────────
  const YEAR_MIN = 2020, YEAR_MAX = 2031;

  function getPropValAt(c, yFrac) {
    if (yFrac < c.purchFrac) return 0;
    if (yFrac >= c.lastFrac)
      return c.cv * Math.pow(1 + c.forwardRate/100, yFrac - c.lastFrac);
    // Historical interpolation between purchase price and snapshots
    const pts = [{frac:c.purchFrac, value:c.pp}, ...c.snaps.map(s=>({frac:dateToFrac(s.date), value:s.value}))];
    pts.sort((a,b) => a.frac - b.frac);
    for (let k = 0; k < pts.length-1; k++) {
      if (yFrac >= pts[k].frac && yFrac <= pts[k+1].frac) {
        const t = (yFrac - pts[k].frac) / (pts[k+1].frac - pts[k].frac);
        return pts[k].value + t*(pts[k+1].value - pts[k].value);
      }
    }
    return pts[pts.length-1].value;
  }

  const series = CVS.map(c => {
    const pts = [];
    // Purchase price anchor
    pts.push({x: c.purchFrac, y: c.pp, projected: false});
    // IS24/user snapshots
    c.snaps.forEach(s => { if (dateToFrac(s.date) > c.purchFrac) pts.push({x: dateToFrac(s.date), y: s.value, projected: false}); });
    // Forward projection in half-year steps
    for (let y = c.lastFrac + 0.5; y <= YEAR_MAX + 0.1; y += 0.5)
      pts.push({x: Math.min(y, YEAR_MAX), y: Math.round(c.cv * Math.pow(1+c.forwardRate/100, Math.min(y,YEAR_MAX)-c.lastFrac)), projected: true});
    return {name:c.name, color:c.color, points:pts};
  });

  // Portfolio total
  const portPts = [];
  for (let yI = 0; yI <= (YEAR_MAX-YEAR_MIN)*2; yI++) {
    const yF = YEAR_MIN + yI*0.5;
    let tot = 0, hasAny = false;
    CVS.forEach(c => { if (yF >= c.purchFrac) { tot += getPropValAt(c,yF); hasAny=true; } });
    if (hasAny) portPts.push({x:yF, y:Math.round(tot), projected: yF > Math.max(...CVS.map(c=>c.lastFrac))});
  }
  series.push({name:'Portfolio', color:'#f9fafb', thick:true, points:portPts});

  const lcCard = document.createElement('div');
  lcCard.className='card chart-wrap'; lcCard.style.marginBottom='16px';
  lcCard.innerHTML='<div class="chart-title">Property Value — Market Data Snapshots + Forward Projection (€)</div>'
    +'<div class="chart-sub">Dots = market snapshots (actual observed price). Solid line = historical. Dashed = forward projection. Hover for values.</div>';
  lcCard.appendChild(makeLineChart({series, W:940, H:280, ml:72, mr:100}));
  const leg = document.createElement('div'); leg.className='legend';
  [...CVS.map(c=>({name:c.name,color:c.color})), {name:'Portfolio',color:'#f9fafb'}]
    .forEach(s => { const div=document.createElement('div'); div.className='leg-item';
      div.innerHTML=`<div class="leg-dot" style="background:${s.color}"></div>${s.name}`; leg.appendChild(div); });
  lcCard.appendChild(leg);
  sec.appendChild(lcCard);

  // ── Value table ──────────────────────────────────────────────────────────────
  const tCard = document.createElement('div');
  tCard.className='card'; tCard.style.overflowX='auto'; tCard.style.marginBottom='16px';
  tCard.innerHTML='<div class="chart-title" style="margin-bottom:10px">Current Values &amp; Equity</div>';
  let html=`<table><thead><tr>
    <th class="left">Property</th><th>Size</th><th>Stadtteil</th><th>Klasse</th>
    <th>Purchase Price</th><th>€/m² (Immowelt)</th><th>Gap %</th><th>Abschlag %</th>
    <th>Est. Value</th><th>Gain vs Purchase</th><th>Gain %</th>
    <th>Remaining Debt</th><th>Real Equity</th><th>Proj. 2031</th>
  </tr></thead><tbody>`;
  CVS.forEach(c => {
    const md    = MORTGAGE_DATA[c.id];
    const rem   = md.loanAmt - md.tilgungPaid;
    const eq    = c.cv - rem;
    const v31   = Math.round(c.cv * Math.pow(1+c.forwardRate/100, 2031-c.lastFrac));
    const s     = c.last;
    const gap   = s ? (s.askingGap ?? s.discount ?? 8) : 8;
    const absch = s ? (s.vermietungsAbschlag ?? 0) : 0;
    const klasse = s?.energyClass ?? '—';
    const klasseColor = {'A+':'#34d399','A':'#6ee7b7','B':'#a7f3d0','C':'#fde68a','D':'#fbbf24','E':'#fb923c','F':'#f87171','G':'#ef4444','H':'#dc2626'}[klasse] || '#9ca3af';
    html+=`<tr>
      <td class="left">${c.name}</td>
      <td style="color:#9ca3af">${c.size}m²</td>
      <td style="color:#9ca3af;font-size:10px">${s?.stadtteil||'—'}</td>
      <td style="color:${klasseColor};font-weight:700">${klasse}</td>
      <td>${fe(c.pp)}</td>
      <td style="color:#a78bfa">${s ? fe(s.pricePerSqm) : '—'}/m²</td>
      <td style="color:#9ca3af">${gap}%</td>
      <td style="color:#fbbf24">${absch}%</td>
      <td style="color:#60a5fa;font-weight:600">${fe(c.cv)}</td>
      <td style="color:${vc(c.gainAmt)}">${fe(Math.round(c.gainAmt))}</td>
      <td style="color:${vc(c.gainPct)};font-weight:600">${fp(c.gainPct,1)}</td>
      <td style="color:#f87171">${fe(Math.round(rem))}</td>
      <td style="color:#34d399;font-weight:600">${fe(Math.round(eq))}</td>
      <td style="color:#818cf8">${fe(v31)} <span style="color:#6b7280;font-size:9px">(+${fp(c.forwardRate,1)}/yr)</span></td>
    </tr>`;
  });
  const totalEq  = totalCV - totalRem;
  const total31  = CVS.reduce((s,c) => s + Math.round(c.cv * Math.pow(1+c.forwardRate/100, 2031-c.lastFrac)), 0);
  html+=`<tr class="total">
    <td class="left">PORTFOLIO</td><td>—</td><td>—</td><td>—</td>
    <td>${fe(totalPP)}</td><td>—</td><td>—</td><td>—</td>
    <td style="color:#60a5fa;font-weight:600">${fe(Math.round(totalCV))}</td>
    <td style="color:${vc(totalGn)}">${fe(Math.round(totalGn))}</td>
    <td style="color:${vc(totalGn/totalPP*100)};font-weight:600">${fp(totalGn/totalPP*100,1)}</td>
    <td style="color:#f87171">${fe(Math.round(totalRem))}</td>
    <td style="color:#34d399;font-weight:600">${fe(Math.round(totalEq))}</td>
    <td style="color:#818cf8">${fe(total31)}</td>
  </tr></tbody></table>`;
  tCard.innerHTML += html;
  sec.appendChild(tCard);

  // ── Update note ───────────────────────────────────────────────────────────────
  const formCard = document.createElement('div');
  formCard.className='card'; formCard.style.marginBottom='16px';
  formCard.innerHTML=`
    <div class="chart-title" style="margin-bottom:6px">📥 Snapshots managed via Airtable</div>
    <div style="font-size:12px;color:#d1d5db;line-height:1.6">
      Snapshots are stored in Airtable (<b style="color:#60a5fa">Market Value Snapshots</b> table)
      and written into this dashboard by the <b style="color:#a78bfa">market-value-update</b> scheduled task.
      The task runs every quarter — it fetches Immowelt Stadtteil price pages, saves the values to Airtable,
      and rewrites the <code style="color:#fbbf24">MARKET_SNAPSHOTS</code> constant in this file.
    </div>
    <div style="margin-top:10px;font-size:11px;color:#6b7280">
      ${MARKET_SNAPSHOTS.length} snapshot(s) loaded.
      Last: ${lastDate || '—'}.
    </div>`;
  sec.appendChild(formCard);

  // ── Forward rate editor ──────────────────────────────────────────────────────
  const rateCard = document.createElement('div');
  rateCard.className='card'; rateCard.style.marginBottom='16px';
  rateCard.innerHTML=`
    <div class="chart-title" style="margin-bottom:6px">⚙️ Forward Projection Rates</div>
    <div class="chart-sub" style="margin-bottom:10px">Applies only to the dashed future line, starting from the latest snapshot. Has no effect on current or historical values.</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
      ${CVS.map(c => `
        <div style="display:flex;flex-direction:column;gap:3px">
          <label style="font-size:10px;color:${c.color}">${c.name} %/yr</label>
          <input id="fwd-${c.id}" type="number" step="0.1" value="${c.forwardRate}"
            style="background:#1c2535;color:#f9fafb;border:1px solid #374151;border-radius:6px;padding:6px 10px;font-size:12px;width:80px">
        </div>
      `).join('')}
      <button onclick="saveFwdRates()"
        style="background:#7c3aed;color:white;border:none;border-radius:6px;padding:8px 16px;font-size:12px;cursor:pointer;font-weight:600;margin-top:auto">
        Apply &amp; Refresh
      </button>
    </div>`;
  sec.appendChild(rateCard);

  const fn = document.createElement('div');
  fn.className='footnotes';
  fn.innerHTML=`
    <b>Method:</b> IS24 Schätzwert (Automated Valuation Model) is used directly as the estimated market value per property.
    IS24's AVM draws on comparable transaction and listing data for the specific Stadtteil, incorporating location, building age, condition, and energy efficiency.
    The €/m² (asking) and gap% fields are back-calculated from the IS24 value for reference and cross-checking — they are not the primary input.<br>
    <b>Vermietungsabschlag</b> (tenanted discount, stored as metadata): 20% for Frankfurt/Berlin, 15% for Leipzig/Eschweiler.
    Not applied to the stated value because IS24's AVM already reflects the mix of investor and owner-occupier transactions in each market.
    This can be reconsidered once we have multiple quarters of data to compare against actual transaction prices.<br>
    <b>Energy class</b> (from Energieausweise): Berlin E · Eschweiler D · Hügelstr. E · Ohmstr. C · Leipzig E. Incorporated by IS24; stored here for reference.<br>
    <b>Heating</b>: All 5 properties run on Erdgas central heating. Heating factor = 0% for all.<br>
    <b>Data source:</b> Snapshots stored in Airtable (Market Value Snapshots table) and embedded here by the quarterly scheduled task.<br>
    <b>Forward projection:</b> Compound growth from the latest snapshot at the rate set above. Illustrative only.`;
  sec.appendChild(fn);
}

function saveFwdRates() {
  const rates = JSON.parse(localStorage.getItem('re_mkt_fwdrates') || '{}');
  D.forEach(d => {
    const el = document.getElementById(`fwd-${d.id}`);
    const v  = parseFloat(el?.value);
    if (!isNaN(v)) rates[d.id] = v;
  });
  localStorage.setItem('re_mkt_fwdrates', JSON.stringify(rates));
  document.getElementById('market-value').innerHTML = '';
  renderMarketValue();
}

// ─── BREAK-EVEN ──────────────────────────────────────────────────────────────
function renderBreakEven() {
  const sec = document.getElementById('break-even');
  sec.innerHTML = '';

  const PROP_ORDER  = ['berlin','eschweiler','huegelstr','ohmstr','leipzig'];
  const PROP_LABELS = {
    berlin:     'Berlin',
    eschweiler: 'Eschweiler',
    huegelstr:  'Hügelstr (EG+Mansarde)',
    ohmstr:     'Ohmstraße',
    leipzig:    'Leipzig',
  };
  const PROP_COLORS = {
    berlin:     '#60a5fa',
    eschweiler: '#f59e0b',
    huegelstr:  '#2dd4bf',
    ohmstr:     '#c084fc',
    leipzig:    '#f43f5e',
  };

  // Group AT_BE by property, sorted by year
  const byProp = {};
  PROP_ORDER.forEach(id => {
    byProp[id] = AT_BE.filter(r => r.prop === id).sort((a,b) => a.year - b.year);
  });

  // First year where beAll >= 0
  function getBEYear(id) {
    for (const r of byProp[id]) if (r.beAll >= 0) return r.year;
    return null;
  }
  // First year where beAll + oppCost > 0 (outperforms 7% alternative)
  function getBeats7Year(id) {
    for (const r of byProp[id]) if (r.beAll + r.oppCost > 0) return r.year;
    return null;
  }
  // KNK total from KNK_DETAIL
  function getKNKTotal(id) {
    return (KNK_DETAIL[id] || []).reduce((s,t) => s + t.amount, 0);
  }
  // Initial furnishing total from AT_FUR_DETAIL
  function getFurTotal(id) {
    return (AT_FUR_DETAIL[id] || []).reduce((s,t) => s + t.amount, 0);
  }
  // Equity paid in — from first AT_BE record that has equityPaid field
  function getEquityPaid(id) {
    const r = byProp[id].find(r => r.equityPaid != null);
    return r ? r.equityPaid : null;
  }
  // Most recent Actual progress value
  function getCurrentProgress(id) {
    const actuals = byProp[id].filter(r => r.source === 'Actual');
    return actuals.length ? actuals[actuals.length-1].progress : null;
  }

  // ── Chart card ──────────────────────────────────────────────────────────────
  const propData = PROP_ORDER.map(id => ({
    id,
    label: PROP_LABELS[id],
    color: PROP_COLORS[id],
    rows:  byProp[id],
  }));

  const chartCard = document.createElement('div');
  chartCard.className = 'card';
  chartCard.style.cssText = 'padding:16px 16px 8px;margin-bottom:12px';
  const chartTitle = document.createElement('div');
  chartTitle.className = 'card-label';
  chartTitle.style.marginBottom = '8px';
  chartTitle.textContent = 'Break-Even Progress — All Properties';
  chartCard.appendChild(chartTitle);
  chartCard.appendChild(makeBreakEvenLineChart({propData}));
  sec.appendChild(chartCard);

  // ── Summary table ────────────────────────────────────────────────────────────
  const tblCard = document.createElement('div');
  tblCard.className = 'card';
  tblCard.style.cssText = 'padding:16px;margin-bottom:12px;overflow-x:auto';

  let html = `<div class="card-label" style="margin-bottom:8px">Break-Even Summary</div>
<table style="width:100%;border-collapse:collapse;font-size:12px">
<thead><tr style="border-bottom:1px solid #374151">
  <th style="text-align:left;padding:6px 8px;color:#9ca3af;font-weight:500">Property</th>
  <th style="text-align:right;padding:6px 8px;color:#9ca3af;font-weight:500">Break-Even Year</th>
  <th style="text-align:right;padding:6px 8px;color:#9ca3af;font-weight:500">Beats 7% Year</th>
  <th style="text-align:right;padding:6px 8px;color:#9ca3af;font-weight:500">KNK Total ⓘ</th>
  <th style="text-align:right;padding:6px 8px;color:#9ca3af;font-weight:500">Initial Furnishing ⓘ</th>
  <th style="text-align:right;padding:6px 8px;color:#9ca3af;font-weight:500">Equity Paid In</th>
  <th style="text-align:right;padding:6px 8px;color:#9ca3af;font-weight:500">Progress (2025 Actual)</th>
</tr></thead><tbody>`;

  PROP_ORDER.forEach(id => {
    const beYear   = getBEYear(id);
    const beats7   = getBeats7Year(id);
    const knkTotal = getKNKTotal(id);
    const furTotal = getFurTotal(id);
    const equity   = getEquityPaid(id);
    const progress = getCurrentProgress(id);
    const pct      = progress !== null ? Math.min(100, Math.max(0, progress * 100)) : null;
    const pctStr   = pct !== null ? pct.toFixed(0)+'%' : '—';
    const pctColor = pct !== null && pct >= 100 ? '#34d399' : pct !== null && pct >= 50 ? '#fbbf24' : '#f87171';
    const showEq   = id === 'leipzig' || id === 'berlin';
    const eqStr    = showEq && equity != null
      ? `<span style="color:#f9fafb">${fe(Math.abs(equity))}</span>`
      : `<span style="color:#6b7280">—</span>`;

    html += `<tr style="border-bottom:1px solid #1f2937">
  <td style="padding:8px;font-weight:500;color:#f9fafb">${PROP_LABELS[id]}</td>
  <td style="text-align:right;padding:8px;color:${beYear ? '#34d399' : '#9ca3af'}">${beYear || '>2035'}</td>
  <td style="text-align:right;padding:8px;color:${beats7 ? '#60a5fa' : '#9ca3af'}">${beats7 || '>2035'}</td>
  <td style="text-align:right;padding:8px;cursor:pointer;color:#f9fafb;text-decoration:underline dotted"
      onmouseenter="showKNKDetailTooltip(event,'${id}')" onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()">${fe(knkTotal)}</td>
  <td style="text-align:right;padding:8px;cursor:pointer;color:#f9fafb;text-decoration:underline dotted"
      onmouseenter="showFurTooltip_BE(event,'${id}')" onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()">${fe(furTotal)}</td>
  <td style="text-align:right;padding:8px">${eqStr}</td>
  <td style="text-align:right;padding:8px;color:${pctColor};font-weight:500">${pctStr}</td>
</tr>`;
  });

  html += `</tbody></table>`;
  tblCard.innerHTML = html;
  sec.appendChild(tblCard);

  // ── Assumptions / footnote ───────────────────────────────────────────────────
  const fn = document.createElement('div');
  fn.className = 'footnote';
  fn.innerHTML = `<b>Source:</b> All values from Airtable base appOKVoE79fxV1WlI, table "Break-Even Analysis_Historical Annuals". No calculations performed outside Airtable.<br>
<b>Break Even_All:</b> Cumulative net cash position including all revenues, operating costs, mortgage interest, KNK, and initial furnishing. Negative = still in deficit. Breaks even when it first reaches ≥ 0.<br>
<b>Opportunity Costs (7% p.a.):</b> What the total capital deployed would have grown to if invested in equities at 7% p.a. compound from the purchase date. "Beats 7%" = first year where <code>Break Even_All + Opportunity Costs &gt; 0</code>.<br>
<b>Solid line</b> = Actual years (DKB CSV + invoice PDFs). <b>Dashed line</b> = Projections from 2026 onward: Rent +2%/yr, Hausgeld +2%/yr, refi at current rate; vacancy 3% Eschweiler, 0% all others; €10/m²/yr Rücklage.<br>
<b>Dotted line</b> (faded) = Opportunity cost track per property (7% p.a. on total capital deployed).<br>
<b>Equity Paid In</b> shown only for Leipzig (−€7,000) and Berlin (−€16,000); these are the two properties with additional own-equity above the mortgage. Other properties: own equity is netted into the total capital base within Airtable.<br>
<b>Progress</b> = Airtable "Progress" field for the most recent Actual year (2025). Values below 0 = further from break-even than at purchase; 0–1 = en route; 1 = break-even reached.`;
  sec.appendChild(fn);
}


// ─── TAB SWITCHING ───────────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector(`[onclick="showTab('${id}')"]`).classList.add('active');
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderOverview();
renderDetail();
renderMortgages();
renderMarketValue();
renderBreakEven();
</script>
